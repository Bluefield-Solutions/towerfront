# Auslieferung nach GitHub Pages.
#
# Der wichtigste Satz steht in Zeile "Torkette": gebaut und veroeffentlicht
# wird nur, wenn alle siebzehn Pruefungen gruen sind. Ein rotes Tor darf nie
# live gehen - sonst waere die ganze Kette Zierrat.
#
# (Hier stand "elf", waehrend die Kette schon vierzehn Schritte hatte. Der
# Dokumentenwaechter zaehlt die Torschritte gegen die Prosa - aber er liest
# nur Markdown, und dieser Plan ist YAML. Eine Zahl in einem Kommentar, die
# niemand prueft, veraltet genauso lautlos wie eine in der Doku.)
name: Bauen und ausliefern

on:
  push:
    # Beide Namen, damit der Plan nicht am Zweignamen scheitert.
    #
    # Er lauschte nur auf `main`, das Repository heisst aber `master` - der
    # Plan waere nie gelaufen, und die Torkette vor der Auslieferung damit
    # wirkungslos gewesen. Genau das, wovor die Datei selbst warnt.
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laeuft ein Durchgang noch, wird er abgebrochen: der neuere Stand gilt.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  tor:
    name: Torkette
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Chromium fuer das Browsertor.
      #
      # Es laedt die fertig gebaute Datei in einem echten Browser - das ist
      # der einzige Weg, die Kaskade zu pruefen, und damit der einzige Weg,
      # Fehler wie v50 zu fangen (Turmleiste ueber der Landkarte, man kam
      # nicht ins Spiel, alle Tore gruen).
      #
      # Ohne Browser bricht das Tor ab, statt sich still zu ueberspringen.
      # Das ist Absicht: eine Pruefung, die bei fehlendem Werkzeug Gruen
      # meldet, ist schlimmer als keine.
      - name: Chromium
        run: npx playwright install --with-deps chromium
      # Die vollstaendige Kette. Sie baut auch, deshalb liegt dist danach
      # bereit und muss nicht ein zweites Mal erzeugt werden.
      - name: Torkette
        run: npm run gate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  ausliefern:
    name: Ausliefern
    needs: tor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
