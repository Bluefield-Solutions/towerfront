# Der volle Gegenprobenlauf - nachts, auf dem Runner, nicht in der Sitzung.
#
# **Warum er hierher gehoert.** Der Lauf baut nacheinander 249 Fehler ein und
# prueft, ob das zustaendige Tor sie meldet. Er dauert rund fuenfzig Minuten,
# und die standen bisher zwischen jeder Runde und der naechsten. Das ist die
# falsche Stelle: die Arbeit ist wichtig, aber niemand muss dabei zusehen.
#
# Der Lauf schreibt bei Erfolg `tools/proben-stand.txt` fort - Fassung und
# Commit. Die Fassung traegt die Drei-Fassungs-Regel in `npm run muster`, der
# Commit sagt dem taeglichen Umfangslauf, wogegen er `git diff` rechnet.
#
# Der Push mit dem GITHUB_TOKEN loest KEINEN weiteren Plan aus (GitHub
# unterbindet das gegen Endlosschleifen). Die Auslieferung wird deshalb bei
# Bedarf von Hand angestossen - `workflow_dispatch` an `deploy.yml`.
name: Gegenproben (voll)

on:
  schedule:
    # 02:15 UTC - nachts in Mitteleuropa, und nicht zur vollen Stunde, weil
    # GitHub die Zeitpunkte dann staut.
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proben
  cancel-in-progress: false

jobs:
  proben:
    name: Alle Gegenproben
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Chromium
        run: npx playwright install --with-deps chromium
      # `continue-on-error`, damit der Befund auch nach einem roten Lauf noch
      # geschrieben und eingecheckt wird. Rot bleibt der Lauf trotzdem - der
      # letzte Schritt reicht das Ergebnis durch.
      #
      # Das Protokoll liegt unter /tmp und nicht im Baum: `npm run proben`
      # verweigert den Dienst bei schmutzigem Baum, und `git status
      # --porcelain` zaehlt auch unverfolgte Dateien mit.
      - name: Alle Gegenproben
        id: lauf
        continue-on-error: true
        run: npm run proben -- --voll 2>&1 | tee /tmp/proben-lauf.log
      # **Der Befund muss einen Weg zurueck ins Tor finden.**
      #
      # Bis v226 landete er nur hier im Protokoll. Dreimal ist der Lauf
      # gefahren, zweimal rot, und beide Befunde habe ich nur gefunden, weil
      # ich nachgesehen habe. Jetzt steht er eingecheckt in
      # `tools/proben-befund.txt`, und `npm run muster` liest ihn in jeder
      # Torkette.
      - name: Befund festhalten
        if: always()
        run: |
          kurz="${GITHUB_SHA:0:8}"
          if grep -q "beweisen nichts" /tmp/proben-lauf.log 2>/dev/null; then
            {
              echo "BEFUND vom $(date -u +%Y-%m-%dT%H:%MZ) auf $kurz:"
              sed -n '/beweisen nichts/,$p' /tmp/proben-lauf.log | head -20
            } > tools/proben-befund.txt
          elif [ "${{ steps.lauf.outcome }}" = "failure" ]; then
            # Rot, aber ohne die uebliche Zeile - abgebrochen, abgestuerzt oder
            # zeitlich abgelaufen. Auch das ist ein Befund; ihn als "sauber" zu
            # schreiben waere die schlimmere Haelfte.
            {
              echo "BEFUND vom $(date -u +%Y-%m-%dT%H:%MZ) auf $kurz:"
              echo "Der volle Lauf ist rot geendet, ohne eine Probenmeldung zu"
              echo "hinterlassen - abgebrochen, abgestuerzt oder zeitlich abgelaufen."
              tail -12 /tmp/proben-lauf.log 2>/dev/null || echo "(kein Protokoll)"
            } > tools/proben-befund.txt
          else
            echo "sauber $(date -u +%Y-%m-%d) $kurz" > tools/proben-befund.txt
          fi
          if git diff --quiet -- tools/proben-stand.txt tools/proben-befund.txt; then
            echo "Stand und Befund unveraendert."
          else
            git config user.name  "Gegenproben"
            git config user.email "noreply@anthropic.com"
            git add tools/proben-stand.txt tools/proben-befund.txt
            git commit -m "Probenlauf: $(head -1 tools/proben-befund.txt)"
            git push
          fi
      # Der Lauf ist rot, wenn die Proben rot waren - erst hier, damit der
      # Befund vorher seinen Weg in den Baum gefunden hat.
      - name: Ergebnis durchreichen
        if: steps.lauf.outcome == 'failure'
        run: |
          echo "Der volle Probenlauf ist rot. Der Befund steht in tools/proben-befund.txt."
          exit 1
