# Der volle Gegenprobenlauf - nachts, auf dem Runner, nicht in der Sitzung.
#
# **Warum er hierher gehoert.** Der Lauf baut nacheinander 377 Fehler ein und
# prueft, ob das zustaendige Tor sie meldet. Niemand muss dabei zusehen.
#
# **Warum er seit v307 in Scheiben faehrt.** Am 10.09.2026 ist er in zwei
# Stunden nicht fertig geworden und an seiner eigenen `timeout-minutes: 120`
# gestorben - ohne Stand, ohne Befund, ohne dass irgendjemand eine Zahl
# bekommen haette. Ueber der Werkstattdatei stand dabei "rund fuenfzig
# Minuten", und diese Zahl ist aus der Zeit von 249 Proben; heute sind es 377,
# und die teuersten sind dazugekommen (29 an `sim`, 49 an `browsertor`).
#
# Dieselbe Falle wie bei `npm run gate`, wo sie seit v268 dreimal
# aufgeschrieben steht: eine Laufzeit, die niemand nachmisst, wird nicht
# laenger, sondern nur falscher. Hier verdirbt sie nicht nur eine Zahl im
# Dokument - ohne den vollen Lauf schreibt niemand `tools/proben-stand.txt`
# fort, die Zeitratsche schlaegt an, und die ganze Torkette ist rot. Eine
# Vorsichtsmassnahme, die den Betrieb anhaelt, wenn sie selbst zu langsam
# wird, ist keine.
#
# Die Arbeit ist von Natur aus teilbar: jede Probe baut ihren Fehler ein,
# faehrt ihr Tor und nimmt ihn zurueck. Keine weiss von der anderen.
#
# Der Lauf schreibt bei Erfolg `tools/proben-stand.txt` fort - Fassung,
# Commit und Zeit. Die Zeit traegt die Zeitratsche in `npm run muster`, der
# Commit sagt dem taeglichen Umfangslauf, wogegen er `git diff` rechnet.
# Geschrieben wird er im zusammenfuehrenden Schritt und nur dann, wenn ALLE
# Scheiben gruen waren - eine Scheibe hat die anderen nicht gesehen.
#
# Der Push mit dem GITHUB_TOKEN loest KEINEN weiteren Plan aus (GitHub
# unterbindet das gegen Endlosschleifen). Die Auslieferung wird deshalb bei
# Bedarf von Hand angestossen - `workflow_dispatch` an `deploy.yml`.
name: Gegenproben (voll)

on:
  schedule:
    # 02:15 UTC - nachts in Mitteleuropa, und nicht zur vollen Stunde, weil
    # GitHub die Zeitpunkte dann staut.
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proben
  cancel-in-progress: false

jobs:
  scheiben:
    name: Gegenproben ${{ matrix.teil }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # **`fail-fast: false` ist hier keine Nachlaessigkeit, sondern der
      # Zweck.** Eine rote Scheibe sagt, dass EINE Probe nichts beweist; die
      # anderen fuenf sollen ihre Befunde trotzdem liefern. Abzubrechen hiesse,
      # nach dem ersten Fund blind zu werden.
      fail-fast: false
      matrix:
        teil: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Chromium
        run: npx playwright install --with-deps chromium
      # `continue-on-error`, damit das Protokoll auch nach einem roten Lauf
      # noch als Beweisstueck hochgeladen wird. Rot bleibt die Scheibe
      # trotzdem - der zusammenfuehrende Schritt liest das Ergebnis.
      #
      # Das Protokoll liegt unter /tmp und nicht im Baum: `npm run proben`
      # verweigert den Dienst bei schmutzigem Baum, und `git status
      # --porcelain` zaehlt auch unverfolgte Dateien mit.
      #
      # **`set -o pipefail` ist hier die ganze Miete** (v312). Ohne es ist der
      # Ausgang einer Rohrleitung der Ausgang des LETZTEN Gliedes - also von
      # `tee`, und das gelingt immer. Der Lauf vom 10.09.2026 meldete deshalb
      # sechs gruene Scheiben, waehrend eine Probe ihren Gegenstand verloren
      # hatte und der Lauf mit Ausgang 1 endete. Ein Tor, das nicht rot werden
      # KANN, ist kein Tor - und dieses konnte es seit v221 nicht, denn schon
      # der ungeteilte Lauf stand hinter demselben Rohr. Was es bis v307
      # rettete, war der Griff nach dem Protokoll (`grep "beweisen nichts"`);
      # v307 hat den durch den Ausgang ersetzt und damit die einzige
      # funktionierende Haelfte entfernt.
      - name: Scheibe fahren
        id: lauf
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run proben -- --voll --teil=${{ matrix.teil }}/6 2>&1 | tee /tmp/proben-lauf.log
      # **Zwei Quellen, eine Stelle.** Der Ausgang sagt, ob der Lauf gescheitert
      # ist; das Protokoll sagt es noch einmal mit eigenen Worten. Beides hier
      # zusammenzufuehren ist kein Verstoss gegen Regel 15 - es ist eine
      # Stelle, an der zwei unabhaengige Signale zu EINEM Urteil werden. Wer
      # nur den Ausgang liest, ist blind, sobald ein Rohr dazwischenkommt;
      # wer nur das Protokoll liest, ist blind, sobald sich eine Meldung
      # umformuliert.
      - name: Ergebnis der Scheibe festhalten
        if: always()
        shell: bash
        run: |
          aus="${{ steps.lauf.outcome }}"
          if grep -qE "beweisen nichts|Eingriff kam nicht an|Baum ist nicht sauber" \
               /tmp/proben-lauf.log 2>/dev/null; then
            echo "Das Protokoll meldet einen Befund - die Scheibe zaehlt als rot."
            aus=failure
          fi
          echo "$aus" > /tmp/ausgang.txt
          mkdir -p /tmp/scheibe
          cp /tmp/proben-lauf.log /tmp/scheibe/lauf.log
          cp /tmp/ausgang.txt /tmp/scheibe/ausgang.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheibe-${{ matrix.teil }}
          path: /tmp/scheibe
          retention-days: 7

  zusammenfuehren:
    name: Befund und Stand
    needs: scheiben
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: scheibe-*
          path: /tmp/scheiben
      # **Der Befund muss einen Weg zurueck ins Tor finden.**
      #
      # Bis v226 landete er nur im Protokoll. Dreimal ist der Lauf gefahren,
      # zweimal rot, und beide Befunde wurden nur gefunden, weil jemand
      # nachgesehen hat. Jetzt steht er eingecheckt in
      # `tools/proben-befund.txt`, und `npm run muster` liest ihn in jeder
      # Torkette.
      #
      # **Eine fehlende Scheibe zaehlt als rot.** Sie kann abgebrochen,
      # abgestuerzt oder zeitlich abgelaufen sein - genau der Fall vom
      # 10.09.2026 -, und "keine Meldung" als "nichts gefunden" zu lesen waere
      # die schlimmere Haelfte.
      - name: Befund und Stand
        run: |
          kurz="${GITHUB_SHA:0:8}"
          rot=0
          fehlend=""
          for i in 0 1 2 3 4 5; do
            aus="/tmp/scheiben/scheibe-$i/ausgang.txt"
            if [ ! -f "$aus" ]; then rot=1; fehlend="$fehlend $i"; continue; fi
            if [ "$(cat "$aus")" != "success" ]; then rot=1; fi
          done
          if [ "$rot" = "1" ]; then
            {
              echo "BEFUND vom $(date -u +%Y-%m-%dT%H:%MZ) auf $kurz:"
              if [ -n "$fehlend" ]; then
                echo "Ohne Ergebnis geblieben:$fehlend (abgebrochen, abgestuerzt"
                echo "oder zeitlich abgelaufen). Eine fehlende Scheibe zaehlt als rot."
              fi
              # **Auch der vorzeitige Abbruch gehoert in den Befund** (v313).
              #
              # Bis v313 wurde nur ab "beweisen nichts" ausgeschnitten. Eine
              # Scheibe, die gar nicht erst arbeitet, weil ein Tor schon OHNE
              # eingebauten Fehler rot ist, hat diese Zeile nie - sie schreibt
              # "sind schon OHNE eingebauten Fehler rot". Am 10.09.2026 stand
              # deshalb ein Befund da, der NUR aus seiner Kopfzeile bestand:
              # rot, ohne ein Wort dazu, warum. Die Ursache liess sich nur
              # finden, indem jemand die Protokolle der Scheiben las - genau
              # der Weg, den dieser Befund abschaffen soll.
              for i in 0 1 2 3 4 5; do
                log="/tmp/scheiben/scheibe-$i/lauf.log"
                [ -f "$log" ] || continue
                sed -n '/beweisen nichts\|sind schon OHNE eingebauten Fehler rot/,$p' \
                  "$log" | head -12
              done
            } > tools/proben-befund.txt
            # **Und ein Befund ohne Inhalt ist keiner.** Bleibt es bei der
            # Kopfzeile, sagt die Datei das selbst, statt stumm rot zu sein.
            if [ "$(wc -l < tools/proben-befund.txt)" -le 1 ]; then
              echo "Rot, aber keine Scheibe nennt einen Grund. Das Protokoll der" \
                >> tools/proben-befund.txt
              echo "Scheiben steht als Artefakt am Lauf - dort nachsehen." \
                >> tools/proben-befund.txt
            fi
          else
            echo "sauber $(date -u +%Y-%m-%d) $kurz" > tools/proben-befund.txt
            # Das FORMAT der Standzeile steht in `tools/probes.mjs` und nur
            # dort (Regel 15) - ein `echo` hier waere die zweite Stelle.
            node tools/probes.mjs --stand-schreiben
          fi
          if git diff --quiet -- tools/proben-stand.txt tools/proben-befund.txt; then
            echo "Stand und Befund unveraendert."
          else
            git config user.name  "Gegenproben"
            git config user.email "noreply@anthropic.com"
            # **Der Zweig ist inzwischen weitergelaufen** (v312).
            #
            # Der Lauf dauert eine Dreiviertelstunde; in der Zeit wird
            # weitergearbeitet und gepusht. Die Auscheckung dieses Schritts ist
            # aber eine Momentaufnahme vom START des Laufs - `git push` wurde
            # deshalb als nicht vorspulbar abgewiesen, und der Stand blieb
            # ungeschrieben, obwohl alle sechs Scheiben gruen waren.
            #
            # Zusammengefuehrt wird NICHT: Stand und Befund sind Ausgaben
            # dieses Laufs und keine geteilte Bearbeitung. Sie werden
            # beiseitegelegt, der Zweig wird auf den Fernstand gezogen, und
            # dann werden sie wieder hingeschrieben - der letzte Lauf gilt.
            # Ein Rebase koennte an genau diesen zwei Dateien haengenbleiben
            # und braeuchte eine Konfliktregel, die dasselbe sagt.
            cp tools/proben-stand.txt /tmp/stand.txt
            cp tools/proben-befund.txt /tmp/befund.txt
            for versuch in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              git reset --hard "origin/$GITHUB_REF_NAME"
              cp /tmp/stand.txt tools/proben-stand.txt
              cp /tmp/befund.txt tools/proben-befund.txt
              if git diff --quiet -- tools/proben-stand.txt tools/proben-befund.txt; then
                echo "Stand und Befund stehen schon so im Zweig."
                break
              fi
              git add tools/proben-stand.txt tools/proben-befund.txt
              git commit -m "Probenlauf: $(head -1 tools/proben-befund.txt)"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "Stand und Befund gepusht (Versuch $versuch)."
                break
              fi
              echo "Push abgewiesen - der Zweig ist weitergelaufen. Neuer Versuch."
              if [ "$versuch" = "3" ]; then
                echo "Dreimal abgewiesen. Der Lauf war gruen, der Stand ist NICHT geschrieben."
                exit 1
              fi
            done
          fi
          if [ "$rot" = "1" ]; then
            echo "Der volle Probenlauf ist rot. Der Befund steht in tools/proben-befund.txt."
            exit 1
          fi
