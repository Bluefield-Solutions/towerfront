<body>
<!-- Hochkant-Hinweis.
     Das Spiel ist für quer gebaut (Feld 16:9); aufrecht wird das Feld auf
     ein Drittel gequetscht und die Leiste deckt es zu. Statt es schlecht
     anzuzeigen, wird gesagt, was zu tun ist. Reines CSS: kein Bild, kein
     Zaehler, keine Last - und damit auch nichts, was im Querformat noch
     rechnet. -->
<div id="quer" aria-hidden="true">
  <div class="q-bild">▭</div>
  <div class="q-text">Bitte quer halten</div>
  <div class="q-klein">Towerfront ist für das liegende Bild gebaut.</div>
</div>

<div id="app">
  <canvas id="view"></canvas>

  <header class="hud" id="hud">
    <div class="stat">
      <span class="lab">Gold</span>
      <span class="val" id="v-gold">0</span>
    </div>
    <div class="stat">
      <span class="lab">Kristall</span>
      <span class="val danger" id="v-lives">0</span>
    </div>
    <div class="stat">
      <span class="lab">Welle</span>
      <span class="val" id="v-wave">0/0</span>
    </div>
    <div class="spacer"></div>
    <button class="chip" id="b-sound" aria-label="Ton an oder aus">Ton</button>
    <button class="chip" id="b-speed" aria-label="Spieltempo">1×</button>
    <button class="chip" id="b-pause" aria-label="Pause">Pause</button>
  </header>

  <!-- Pausenmenue.
       Bis v93 hielt "Pause" nur die Zeit an - wer eine Partie verlassen oder
       neu anfangen wollte, musste die Seite neu laden. Beides gehoert an die
       Stelle, an der man ohnehin innehaelt. -->
  <div class="pause-menu" id="pause-menu" hidden>
    <div class="pause-card">
      <span class="pause-title">Pause</span>
      <button class="pause-btn primary" id="p-resume">Weiter spielen</button>
      <button class="pause-btn warn" id="p-restart">Level neu starten</button>
      <button class="pause-btn" id="p-quit">Zurück zur Karte</button>
    </div>
  </div>

  <!-- Turmwahl am Bauplatz.
       Erscheint, wenn man auf einen freien Platz tippt - dort, wo gebaut
       werden soll, statt in einer Leiste am Rand. -->
  <div class="pick" id="pick" hidden>
    <div class="pick-row" id="pick-row"></div>
  </div>

  <div class="dock" id="dock">
    <button class="dock-toggle" id="dock-toggle" aria-label="Leiste einklappen">
      <span id="dock-toggle-i">▾</span>
    </button>
    <div class="dock-body" id="dock-body">
      <div class="next" id="next">
        <span class="next-lab" id="n-lab">Als Nächstes</span>
        <span class="next-list" id="n-list"></span>
      </div>
      <div class="dock-row">
        <div class="build" id="build"></div>
        <div class="skills" id="skills"></div>
      </div>
    </div>
  </div>

  <button class="go" id="b-wave"><span id="b-wave-t">Welle starten</span><span class="go-bonus" id="b-wave-b"></span></button>

  <div class="perf" id="perf" hidden></div>

  <div class="coach" id="coach" hidden>
    <p class="coach-text" id="coach-text"></p>
    <button class="coach-skip" id="coach-skip">Überspringen</button>
  </div>

  <aside class="inspector" id="inspector" hidden>
    <div class="insp-head">
      <span class="insp-name" id="i-name">Turm</span>
      <button class="x" id="i-close" aria-label="Schliessen">✕</button>
    </div>
    <!-- Ausbauen steht vor den Werten.
         Umgekehrt lag der Ausbauknopf auf einem Querformat-Bildschirm unter
         dem Rand, und man musste erst scrollen, um den Turm zu verbessern.
         Das ist die Handlung, derentwegen man den Steg oeffnet - Werte sind
         Nachschlagestoff und duerfen darunter liegen. -->
    <div class="insp-ups" id="i-ups"></div>
    <p class="insp-hint" id="i-hint" hidden></p>
    <!-- Ziellogik. Steht über dem Verkaufen, weil es eine Einstellung ist
         und kein Abschied: was man oft anfasst, gehört nach oben.
         (Umlaute ausgeschrieben: HTML-Kommentare landen anders als
         TypeScript-Kommentare im Bündel, und der Autarkie-Check liest den
         ausgelieferten Text. Er hat das hier gefangen.) -->
    <div class="insp-ziel" id="i-ziel"></div>
    <div class="insp-actions">
      <button class="sell" id="i-sell">Verkaufen</button>
    </div>
    <dl class="insp-stats" id="i-stats"></dl>
  </aside>

  <section class="screen" id="screen" hidden>
    <div class="card" id="s-card">

      <!-- Ebene 1: eine Entscheidung. Alles Weitere liegt dahinter. -->
      <div class="view" id="v-main">
        <p class="eyebrow" id="s-eyebrow">Kapitel eins</p>
        <h1 id="s-title">Towerfront</h1>
        <p class="lead" id="s-text"></p>
        <div class="stats" id="s-stats" hidden></div>
        <button class="primary" id="s-resume" hidden>Partie fortsetzen</button>
        <button class="primary" id="s-action">Beginnen</button>
        <button class="choice" id="s-choice">
          <span class="ch-lab">Karte und Schwierigkeit</span>
          <span class="ch-val" id="s-choice-val">Spiralhain · Normal</span>
          <span class="ch-arrow">›</span>
        </button>
        <button class="choice" id="s-open-progress">
          <span class="ch-lab">Fortschritt</span>
          <span class="ch-val" id="s-progress-val">—</span>
          <span class="ch-arrow">›</span>
        </button>
        <p class="best" id="s-best"></p>
      </div>

      <!-- Ebene 2: Karte, Schwierigkeit, Modus -->
      <div class="view" id="v-choose" hidden>
        <button class="back" id="s-back-1">‹ Zurück</button>
        <h2 class="sub">Karte</h2>
        <div class="grades" id="s-maps"></div>
        <h2 class="sub">Schwierigkeit</h2>
        <div class="grades" id="s-grades"></div>
        <h2 class="sub">Modus</h2>
        <div class="grades" id="s-mode"></div>
      </div>

      <!-- Ebene 3: dauerhafte Verbesserungen -->
      <div class="view" id="v-progress" hidden>
        <button class="back" id="s-back-2">‹ Zurück</button>
        <h2 class="sub">Dauerhafte Verbesserungen</h2>
        <div class="perks" id="s-perks"></div>
        <button class="link" id="s-tut">Einführung beim nächsten Spiel zeigen</button>
        <button class="link" id="s-perf">Technikanzeige einschalten</button>
      </div>

    </div>
  </section>

</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
