<style>
/* === Marken. Identisch zu src/marken/marken.css. ====================== */
:root{
  --r1:4px;--r2:8px;--r3:12px;--r4:16px;--r6:24px;--r8:32px;--r12:48px;
  --rund-klein:8px;--rund-karte:16px;--rund-flaeche:24px;--rund-voll:999px;
  --s-klein:16px;--s0:20px;--s1:25px;--s2:31px;--s3:39px;--s4:49px;--s5:61px;
  --f-lesen:"Andika","Comic Sans MS",sans-serif;
  --f-ui:"Plus Jakarta Sans",system-ui,sans-serif;
  --f1:oklch(.88 .055 25);--f2:oklch(.88 .055 75);--f3:oklch(.88 .055 130);
  --f4:oklch(.88 .055 175);--f5:oklch(.88 .055 230);--f6:oklch(.88 .055 285);
  --f7:oklch(.88 .055 330);--auf-flaeche:oklch(.25 .03 250);
  --grund:oklch(.965 .008 85);--papier:oklch(1 0 0);--tinte:oklch(.27 .03 250);
  --tinte2:oklch(.5 .025 250);--tinte3:oklch(.68 .02 250);--linie:oklch(.88 .01 250);
  --akzent:oklch(.55 .15 250);--akzent-h:oklch(.94 .035 250);
  --gut:oklch(.62 .14 155);--gut-h:oklch(.93 .055 155);--warn:oklch(.65 .13 40);
  --tiefe:oklch(.80 .02 250);
  --d-tipp:120ms;--d-zustand:200ms;--d-schirm:320ms;--d-belohnung:500ms;
  --k-standard:cubic-bezier(.2,0,0,1);
}
:root[data-abend="an"]{
  --grund:oklch(.86 .01 85);--papier:oklch(.90 .006 85);
  --f1:oklch(.78 .05 25);--f2:oklch(.78 .05 75);--f3:oklch(.78 .05 130);
  --f4:oklch(.78 .05 175);--f5:oklch(.78 .05 230);--f6:oklch(.78 .05 285);--f7:oklch(.78 .05 330);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--grund);color:var(--tinte);font-family:var(--f-ui);line-height:1.3;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:manipulation;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#buehne{position:absolute;inset:0;display:flex;flex-direction:column}
.schirm{position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity var(--d-schirm) var(--k-standard)}
.schirm.da{opacity:1;pointer-events:auto}

.kopf{display:flex;align-items:center;justify-content:space-between;gap:var(--r3);
  padding:var(--r3) var(--r4);flex:none}
.knopf{font-family:var(--f-ui);font-size:var(--s0);font-weight:700;color:var(--tinte2);
  background:var(--papier);border:1px solid var(--linie);border-radius:var(--rund-voll);
  padding:var(--r2) var(--r4);min-height:44px;display:flex;align-items:center;gap:var(--r2);cursor:pointer}
.knopf:active{transform:scale(.97)}
.sterne{display:flex;gap:var(--r1)}
.fortschritt{font-family:var(--f-ui);font-size:var(--s0);font-weight:600;color:var(--tinte2);
  font-variant-numeric:tabular-nums}

.mitte{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--r4);padding:var(--r4);min-height:0}
.titel{font-family:var(--f-ui);font-size:var(--s3);font-weight:800;letter-spacing:-.02em;text-align:center}
.unter{font-family:var(--f-ui);font-size:var(--s0);color:var(--tinte2);text-align:center;max-width:34ch}

.wahl{display:flex;gap:var(--r4);flex-wrap:wrap;justify-content:center}
.kachel{background:var(--papier);border:none;border-radius:var(--rund-flaeche);
  box-shadow:0 3px 0 var(--tiefe);padding:var(--r6) var(--r8);min-width:150px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:var(--r2);
  transition:transform var(--d-tipp) var(--k-standard),box-shadow var(--d-tipp) var(--k-standard)}
.kachel:active{transform:translateY(2px);box-shadow:0 1px 0 var(--tiefe)}
.kachel .name{font-family:var(--f-lesen);font-size:var(--s2);font-weight:700;color:var(--auf-flaeche)}
.kachel .rolle{font-family:var(--f-ui);font-size:var(--s-klein);color:var(--tinte3)}
.kachel .kreis{width:64px;height:64px;border-radius:var(--rund-voll);display:flex;
  align-items:center;justify-content:center;font-family:var(--f-lesen);font-size:var(--s2);
  font-weight:700;color:var(--auf-flaeche)}

/* --- Spielfeld --- */
.feld{flex:1;display:flex;gap:var(--r4);padding:0 var(--r4) var(--r4);min-height:0}
@media (orientation:portrait){.feld{flex-direction:column}}
.karte{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;
  touch-action:none}
.karte svg{width:100%;height:100%;overflow:visible}
.karte path.geb{transition:fill var(--d-zustand) var(--k-standard)}
.karte path.ziel{fill:oklch(.80 .12 250)}
/* Alles ausser dem gesuchten Gebiet tritt zurueck. Bei sieben gleich hellen
   Pastellflaechen ist sonst nicht zu erkennen, welche gemeint ist. */
.karte path.geb.ruhig{opacity:.42;filter:saturate(.35)}
.karte path.treffer{fill:oklch(.86 .10 155);opacity:1;filter:none}
.karte .zielrand{opacity:.9}
.karte .zielpuls{animation:pulsrand 1.5s ease-in-out infinite}
@keyframes pulsrand{
  0%,100%{stroke-width:3;stroke-opacity:.95}
  50%    {stroke-width:9;stroke-opacity:.15}
}
.karte .zeiger{animation:huepfen 1.5s ease-in-out infinite;pointer-events:none}
@keyframes huepfen{0%,100%{translate:0 0}50%{translate:0 -6px}}
.seite{flex:none;display:flex;flex-direction:column;gap:var(--r2);min-height:0;
  /* "safe center" statt "center": laeuft der Inhalt ueber, rutscht er sonst
     ueber die OBERE Kante hinaus - im Querformat lag das erste Etikett dann
     unter der Kopfleiste, und der Finger traf die Leiste statt das Etikett. */
  justify-content:center;justify-content:safe center}
@media (orientation:landscape){.seite{width:min(38vw,300px)}}
@media (orientation:portrait){.seite{width:100%;max-height:44vh;overflow:auto}}

.frage{font-family:var(--f-ui);font-size:var(--s1);font-weight:700;text-align:center;
  padding:0 var(--r4) var(--r2)}
.etikett{position:relative;font-family:var(--f-lesen);font-size:var(--s1);font-weight:700;
  color:var(--auf-flaeche);background:var(--papier);border:none;border-radius:var(--rund-karte);
  padding:var(--r3) var(--r4);min-height:56px;display:flex;align-items:center;justify-content:center;
  text-align:center;box-shadow:0 2px 0 var(--tiefe);cursor:grab;touch-action:none;
  transition:transform var(--d-tipp) var(--k-standard),box-shadow var(--d-tipp) var(--k-standard),
             opacity var(--d-zustand) var(--k-standard)}
.etikett.zieht{box-shadow:0 6px 0 var(--tiefe);z-index:50;cursor:grabbing;transition:none}
.etikett.weg{visibility:hidden;pointer-events:none}
.wahlliste{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;
  gap:var(--r3);justify-content:center;justify-content:safe center;padding:2px}
.werkzeug{flex:none;display:flex;gap:var(--r3);align-items:center;justify-content:center;
  padding-top:var(--r2)}
.eingabe{font-family:var(--f-lesen);font-size:var(--s2);font-weight:700;background:var(--papier);
  border:2px solid var(--akzent);border-radius:var(--rund-karte);padding:var(--r3) var(--r4);
  min-height:64px;width:100%;color:var(--auf-flaeche);text-align:center}
.eingabe:focus{outline:none;border-color:var(--akzent);box-shadow:0 0 0 4px var(--akzent-h)}
.hinweis{font-family:var(--f-ui);font-size:var(--s0);line-height:1.4;border-radius:var(--rund-karte);
  padding:var(--r3) var(--r4);background:var(--gut-h);color:var(--auf-flaeche)}
.hinweis.nochmal{background:oklch(.95 .04 85)}
.reihe{display:flex;gap:var(--r2);align-items:center;justify-content:center;flex-wrap:wrap}
.mikro{width:76px;height:76px;border-radius:var(--rund-voll);background:var(--akzent);border:none;
  display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;position:relative}
.mikro::after{content:"";position:absolute;inset:-8px;border-radius:var(--rund-voll);
  border:3px solid var(--akzent);opacity:.3;animation:atmen 2.4s ease-in-out infinite}
@keyframes atmen{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.08);opacity:.1}}
.tonaus{background:var(--tinte3)}
.tonaus::after{display:none}

.gross{font-family:var(--f-ui);font-size:var(--s5);font-weight:800;letter-spacing:-.03em}
.bandhinweis{position:absolute;left:0;right:0;bottom:0;background:var(--tinte);color:var(--papier);
  font-family:var(--f-ui);font-size:var(--s-klein);padding:var(--r2) var(--r4);text-align:center}
/* Kurze Querformate: iPhone quer hat 390 Punkte Hoehe fuer alles. */
@media (max-height:440px){
  .etikett{font-size:var(--s0);min-height:48px;padding:var(--r2) var(--r3)}
  .kopf{padding:var(--r2) var(--r4)}
  .frage{font-size:var(--s0);padding:0 var(--r4) var(--r1)}
  .mikro{width:60px;height:60px}
}
/* --- M3 bis M6: Fortschritt, Forscherbuch, Elternbereich --- */
.balken{width:100%;height:8px;border-radius:var(--rund-voll);background:var(--linie);overflow:hidden}
.balken i{display:block;height:100%;background:var(--app-gut);border-radius:var(--rund-voll);
  transition:width var(--d-zustand) var(--k-standard)}
.balken.klein{height:6px;min-width:60px}
.fach{font-size:var(--s-klein);color:var(--tinte3);font-weight:600;margin-left:var(--r2)}

.rollen{flex:1;min-height:0;overflow:auto;padding:0 var(--r4) var(--r8);
  -webkit-overflow-scrolling:touch;touch-action:pan-y}
.rollen.eltern{max-width:760px;margin:0 auto;width:100%;text-align:left}
.rollen.eltern .unter{text-align:left;max-width:62ch}
.rollen.eltern .reihe{justify-content:flex-start}
.gruppe{font-family:var(--f-ui);font-size:var(--s1);font-weight:800;margin:var(--r6) 0 var(--r3);
  letter-spacing:-.01em}
.kleber{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:var(--r3)}
.aufkleber{background:var(--papier);border:none;border-radius:var(--rund-karte);padding:var(--r2);
  box-shadow:0 2px 0 var(--tiefe);display:flex;flex-direction:column;align-items:center;
  gap:var(--r1);cursor:pointer;opacity:.45}
.aufkleber.da{opacity:1}
.aufkleber{position:relative}
.aufkleber .siegel{position:absolute;top:6px;right:6px;width:12px;height:12px;border-radius:50%;
  background:var(--app-gut);border:2px solid var(--papier)}
.aufkleber svg{width:100%;height:64px}
.aufkleber span{font-family:var(--f-lesen);font-size:var(--s-klein);font-weight:700;
  color:var(--auf-flaeche);text-align:center;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

.pin{display:flex;gap:var(--r3);justify-content:center;align-items:center;min-height:34px}
.pin i{width:16px;height:16px;border-radius:var(--rund-voll);border:2.5px solid var(--akzent);
  transition:background var(--d-tipp) var(--k-standard)}
.pin i.voll{background:var(--akzent)}
.ziffern{display:grid;grid-template-columns:repeat(4,64px);gap:var(--r2);justify-content:center}
.zi{justify-content:center;font-size:var(--s1);min-height:56px}

.kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--r3)}
.wert{background:var(--papier);border-radius:var(--rund-karte);padding:var(--r3) var(--r4);
  box-shadow:0 2px 0 var(--tiefe)}
.wert b{display:block;font-size:var(--s2);font-weight:800;letter-spacing:-.02em}
.wert span{display:block;font-size:var(--s-klein);color:var(--tinte3)}

.tab{width:100%;border-collapse:collapse;background:var(--papier);border-radius:var(--rund-karte);
  overflow:hidden;font-size:var(--s-klein)}
.tab th,.tab td{text-align:left;padding:var(--r2) var(--r3);border-bottom:1px solid var(--linie)}
.tab th{font-weight:700;color:var(--tinte3);font-size:13px}
.tab tr:last-child td{border-bottom:0}
.tab .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ausgabefeld{width:100%;height:180px;font-family:var(--f-mono,monospace);font-size:12px;
  border:1px solid var(--linie);border-radius:var(--rund-klein);padding:var(--r2)}
code{font-family:ui-monospace,monospace;font-size:.9em;background:var(--linie);
  padding:.1em .35em;border-radius:4px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:1ms!important;transition-duration:1ms!important}
  /* Ohne Bewegung muss der Rand allein tragen - also dauerhaft dick. */
  .karte .zielpuls{stroke-width:7;stroke-opacity:.55}
}

 *   1 normalisieren   2 Alias   3 Koelner Phonetik
 *   4 Levenshtein     5 Abstand zum Zweitbesten
 */

const FUELLWOERTER = /^(das ist|das hier ist|ich glaube|das heisst|das waere|aeh+|oeh?m+|hm+)\s+/;

function normalisieren(s) {
  return (s || '').toLowerCase().trim()
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .replace(FUELLWOERTER, '')
    .replace(/[^a-z0-9 ]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

/**
 * Koelner Phonetik. Fuer Deutsch deutlich besser geeignet als Soundex, weil
 * sie auf die deutsche Aussprache gebaut ist: "Austraaljen" und "Australien"
 * bekommen denselben Code, "Meier" und "Mayr" auch.
 *
 * Regeln nach Postel 1969. Buchstaben ausserhalb A–Z werden uebersprungen.
 */
function koelnerPhonetik(wort) {
  const w = normalisieren(wort).replace(/ /g, '').toUpperCase();
  if (!w) return '';
  const codes = [];
  for (let i = 0; i < w.length; i++) {
    const z = w[i], vor = w[i - 1], nach = w[i + 1];
    let c = null;
    switch (z) {
      case 'A': case 'E': case 'I': case 'J': case 'O': case 'U': case 'Y': c = '0'; break;
      case 'B': c = '1'; break;
      case 'P': c = (nach === 'H') ? '3' : '1'; break;
      case 'D': case 'T': c = 'CSZ'.includes(nach) ? '8' : '2'; break;
      case 'F': case 'V': case 'W': c = '3'; break;
      case 'G': case 'K': case 'Q': c = '4'; break;
      case 'C':
        if (i === 0) c = 'AHKLOQRUX'.includes(nach) ? '4' : '8';
        else if ('SZ'.includes(vor)) c = '8';
        else c = 'AHKOQUX'.includes(nach) ? '4' : '8';
        break;
      case 'X': c = 'CKQ'.includes(vor) ? '8' : '48'; break;
      case 'L': c = '5'; break;
      case 'M': case 'N': c = '6'; break;
      case 'R': c = '7'; break;
      case 'S': case 'Z': c = '8'; break;
      case 'H': c = null; break;   // H erzeugt keinen Code
      default: c = null;
    }
    if (c !== null) codes.push(c);
  }
  // Doppelte zusammenziehen, dann alle Nullen ausser der ersten streichen.
  let s = codes.join('').replace(/(.)\1+/g, '$1');
  return s[0] + s.slice(1).replace(/0/g, '');
}

/**
 * Damerau-Levenshtein: wie Levenshtein, aber eine VERTAUSCHUNG zaehlt als
 * ein Schritt, nicht als zwei.
 *
 * Das ist kein Feinschliff. "Bayren" statt "Bayern" ist der haeufigste
 * Tippfehler eines Kindes, und mit reinem Levenshtein liegt er zwei Schritte
 * daneben - also gleich weit wie ein echtes falsches Wort. Die Rueckmeldung
 * waere "falsch" gewesen statt "fast".
 */
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  const d = Array.from({ length: m + 1 }, (_, i) =>
    Array.from({ length: n + 1 }, (_, j) => (i === 0 ? j : j === 0 ? i : 0)));
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++) {
      const kosten = a[i-1] === b[j-1] ? 0 : 1;
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + kosten);
      if (i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1])
        d[i][j] = Math.min(d[i][j], d[i-2][j-2] + 1);   // Vertauschung
    }
  return d[m][n];
}
const relativ = (a, b) => levenshtein(a, b) / Math.max(a.length, b.length, 1);

/** Alle Schreibweisen eines Kandidaten. */
function formen(k) {
  return [k.name, ...(k.aliasse || []), ...(k.aussprache || [])]
    .filter(Boolean).map(normalisieren).filter(Boolean);
}

/**
 * Abstand einer Eingabe zu EINEM Kandidaten. Klein ist gut.
 * Gibt zusaetzlich den Laengenunterschied zurueck - der entscheidet, ob ein
 * Treffer sicher ist oder nur eine Rueckfrage wert.
 *
 * Die Laengenstrafe ist nicht Feinschliff. Ohne sie nimmt der Abgleich
 * "euro" fuer Europa, "bayer" fuer Bayern und "afrikaner" fuer Afrika an:
 * lauter kuerzere oder laengere Woerter, die klanglich fast gleich sind. Das
 * Tor `vergleich` hat dafuer 11,6 % Falsch-Positiv gemeldet.
 */
function abstandZu(eingabe, k) {
  const e = normalisieren(eingabe);
  if (!e) return { d: 1, laenge: 1 };
  const eP = koelnerPhonetik(e);
  let best = 1, besteLaenge = 1;
  for (const f of formen(k)) {
    const laenge = Math.abs(e.length - f.length) / Math.max(e.length, f.length, 1);
    if (f === e) return { d: 0, laenge: 0 };                // Stufe 1/2: Treffer
    const buchstaben = relativ(e, f);
    const klang = eP && koelnerPhonetik(f) ? relativ(eP, koelnerPhonetik(f)) : 1;
    // Der Klang zaehlt mehr: ein Kind spricht richtig und schreibt falsch.
    const d = Math.min(buchstaben, 0.35 * buchstaben + 0.65 * klang) + 0.8 * laenge;
    if (d < best) { best = d; besteLaenge = laenge; }
  }
  return { d: best, laenge: besteLaenge };
}

const GRENZE_ANNAHME = 0.34;   // darueber: gar nicht erst annehmen
const GRENZE_SICHER  = 0.12;   // darunter: ohne Rueckfrage
const ABSTAND_NOETIG = 0.14;   // Vorsprung vor dem Zweitbesten
const LAENGE_SICHER  = 0.15;   // darueber IMMER nur Rueckfrage

/**
 * Der Abgleich. Drei Ausgaenge statt zwei:
 *   { art:'angenommen' }  { art:'rueckfrage' }  { art:'nochmal' }
 *
 * Der mittlere ist der wichtigste: er verwandelt eine Erkennungsschwaeche in
 * eine Bestaetigungsfrage - und die kann ein Kind beantworten.
 */
function abgleich(eingabe, kandidaten) {
  if (!normalisieren(eingabe)) return { art: 'nochmal', grund: 'leer' };
  const bewertet = kandidaten
    .map(k => { const r = abstandZu(eingabe, k); return { k, d: r.d, laenge: r.laenge }; })
    .sort((a, b) => a.d - b.d);
  const [erster, zweiter] = bewertet;
  if (!erster || erster.d > GRENZE_ANNAHME) return { art: 'nochmal', grund: 'zu weit' };
  const vorsprung = zweiter ? zweiter.d - erster.d : 1;
  // Ein Wort, das eine Silbe zu kurz oder zu lang ist, wird NIE ohne
  // Rueckfrage angenommen - auch wenn es klanglich passt. "Meintest du
  // Bayern?" ist die richtige Antwort auf "Bayer", nicht "richtig".
  const sicher = (erster.d <= GRENZE_SICHER || vorsprung >= ABSTAND_NOETIG)
                 && erster.laenge < LAENGE_SICHER;
  return {
    art: sicher ? 'angenommen' : 'rueckfrage',
    id: erster.k.id, name: erster.k.name,
    abstand: +erster.d.toFixed(3), vorsprung: +vorsprung.toFixed(3),
  };
}

/* -------------------------------------------------- Tippen (Lea) -------- */

/**
 * Rechtschreibbewertung. Die Rechtschreibung IST der Lerninhalt - deshalb
 * sagt die Rueckmeldung, WAS falsch war, nicht nur DASS.
 */
function rechtschreibung(eingabe, name) {
  const e = (eingabe || '').trim();
  if (!e) return { urteil: 'leer' };
  if (e === name) return { urteil: 'richtig' };
  if (e.toLowerCase() === name.toLowerCase())
    return { urteil: 'fast', hinweis: 'Fast! Namen schreibt man groß.' };

  const ohneStrich = (x) => x.replace(/[- ]/g, '');
  if (ohneStrich(e).toLowerCase() === ohneStrich(name).toLowerCase()) {
    if (name.includes('-') && !e.includes('-'))
      return { urteil: 'fast', hinweis: 'Fast! Da fehlt ein Bindestrich.' };
    if (!name.includes('-') && e.includes('-'))
      return { urteil: 'fast', hinweis: 'Fast! Da gehört kein Bindestrich hin.' };
    return { urteil: 'fast', hinweis: 'Fast! Achte auf die Leerzeichen.' };
  }
  if (normalisieren(e) === normalisieren(name)) {
    const fehlt = [...'äöüß'].find(u => name.toLowerCase().includes(u) && !e.toLowerCase().includes(u));
    return { urteil: 'fast',
      hinweis: fehlt ? `Fast! Da gehört ein ${fehlt.toUpperCase()} hin.` : 'Fast! Achte auf die Umlaute.' };
  }
  // Ein einziger Buchstabe daneben: die Stelle zeigen, nicht die Lösung.
  const d = levenshtein(e.toLowerCase(), name.toLowerCase());
  if (d <= Math.max(1, Math.floor(name.length / 8))) {
    let i = 0; while (i < e.length && e[i].toLowerCase() === name[i]?.toLowerCase()) i++;
    return { urteil: 'fast', stelle: i,
      hinweis: `Fast! Schau noch mal ab dem ${i + 1}. Buchstaben.` };
  }
  return { urteil: 'falsch' };
}

return { normalisieren, koelnerPhonetik, levenshtein, abstandZu, GRENZE_ANNAHME, GRENZE_SICHER, ABSTAND_NOETIG, LAENGE_SICHER, abgleich, rechtschreibung };
})();

const Leitner = (function(){
/* Fuenf Faecher nach Leitner.
 *
 * Reiner Zufall laesst ein Kind das, was es schon kann, endlos wiederholen
 * und das, was es nicht kann, zufaellig oft.
 *
 * Die Auswahl ist DETERMINISTISCH mit gesetztem Zufallskeim. Ohne das laesst
 * sich die Lernlogik nur behaupten, nicht beweisen.
 */
/**
 * Die Abstaende. Nicht die Lehrbuchreihe 1/3/7/21 Tage.
 *
 * Mit einem TAG zwischen Fach 1 und 2 kommt ein Kind, das nachmittags
 * dreimal spielt, nie ueber Fach 2 hinaus - und sieht deshalb tagelang
 * keinen einzigen Aufkleber. Der Rauchtest hat genau das gezeigt: drei
 * richtige Antworten, null Aufkleber.
 *
 * Zehn Minuten fuer den zweiten Durchgang macht den ersten Aufkleber
 * innerhalb einer Sitzungsfolge erreichbar, ohne die Wiederholungslogik
 * aufzugeben: ab Fach 3 gelten wieder Tage.
 */
const FAECHER = [
  { fach: 1, minuten: 0 },        // jede Sitzung
  { fach: 2, minuten: 10 },       // gleicher Nachmittag
  { fach: 3, minuten: 60 * 24 },  // 1 Tag  - ab hier gibt es einen Aufkleber
  { fach: 4, minuten: 60 * 24 * 3 },
  { fach: 5, minuten: 60 * 24 * 10 },  // gilt als gekonnt
];
const MINUTE = 60000;

function neuerStand() { return {}; }

/** Einen Gegenstand nach einer Antwort verschieben. */
function verschieben(stand, id, richtig, jetzt) {
  const alt = stand[id] || { fach: 1, faellig: 0, richtig: 0, falsch: 0 };
  const fach = richtig ? Math.min(5, alt.fach + 1) : 1;
  return { ...stand, [id]: {
    fach,
    faellig: jetzt + FAECHER[fach - 1].minuten * MINUTE,
    richtig: alt.richtig + (richtig ? 1 : 0),
    falsch: alt.falsch + (richtig ? 0 : 1),
    zuletzt: jetzt,
  }};
}

const istFaellig = (stand, id, jetzt) => !stand[id] || stand[id].faellig <= jetzt;
const istGekonnt = (stand, id) => (stand[id]?.fach ?? 1) >= 5;

/**
 * Ab wann es einen Aufkleber gibt.
 *
 * NICHT erst bei Fach 5. Dorthin braucht ein Gegenstand vier richtige
 * Antworten ueber mehr als drei Wochen - das Forscherbuch bliebe fuer eine
 * Sechsjaehrige wochenlang leer, und die Zusage aus dem Konzept ("sichtbarer
 * Fortschritt, der bleibt") waere gebrochen.
 *
 * Fach 3 heisst: zweimal hintereinander richtig. Das ist innerhalb einer
 * oder zwei Sitzungen zu erreichen und bedeutet trotzdem etwas.
 */
const HAT_AUFKLEBER = 3;
const istGesammelt = (stand, id) => (stand[id]?.fach ?? 1) >= HAT_AUFKLEBER;

function keimZufall(keim) {
  let s = keim >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
function mischen(a, r) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  return b;
}

/**
 * Eine Sitzung zusammenstellen: 70 % faellig, 20 % neu, 10 % gekonnt zur
 * Auffrischung - und NIE mehr als zwei schwere hintereinander. Ein Kind, das
 * dreimal nacheinander scheitert, hoert auf zu spielen.
 */
function sitzung(alle, stand, laenge, jetzt, keim) {
  const r = keimZufall(keim);
  const neu = alle.filter(g => !stand[g.id]);
  const faellig = alle.filter(g => stand[g.id] && istFaellig(stand, g.id, jetzt) && !istGekonnt(stand, g.id));
  const gekonnt = alle.filter(g => istGekonnt(stand, g.id));

  const nimm = (liste, n) => mischen(liste, r).slice(0, Math.max(0, n));
  let aus = [
    ...nimm(faellig, Math.round(laenge * 0.7)),
    ...nimm(neu,     Math.round(laenge * 0.2)),
    ...nimm(gekonnt, Math.round(laenge * 0.1)),
  ];
  // Auffuellen - und dabei ANGEFANGENES vor Neuem.
  //
  // Beim Zufallsauffuellen bekam ein Kind in der zweiten Sitzung fast nur
  // neue Gegenstaende, und kein einziger erreichte Fach 3: das Forscherbuch
  // blieb leer, obwohl zwoelf Antworten richtig waren. Wer etwas angefangen
  // hat, soll es zu Ende bringen duerfen.
  const rest = mischen(alle.filter(g => !aus.some(x => x.id === g.id)), r)
    .sort((a, b) => {
      const fa = stand[a.id]?.fach ?? 0, fb = stand[b.id]?.fach ?? 0;
      if (fa === fb) return 0;
      if (!fa) return 1; if (!fb) return -1;       // Neues ans Ende
      return fb - fa;                               // hoeheres Fach zuerst
    });
  aus = [...aus, ...rest.slice(0, Math.max(0, laenge - aus.length))]
    .slice(0, Math.min(laenge, alle.length));

  // Schwere Gegenstaende entzerren: hoechstens zwei am Stueck.
  const schwer = (g) => (stand[g.id]?.falsch ?? 0) > (stand[g.id]?.richtig ?? 0);
  aus = mischen(aus, r);
  for (let i = 2; i < aus.length; i++) {
    if (schwer(aus[i]) && schwer(aus[i-1]) && schwer(aus[i-2])) {
      const j = aus.findIndex((g, k) => k > i && !schwer(g));
      if (j > 0) { [aus[i], aus[j]] = [aus[j], aus[i]]; }
    }
  }
  return aus;
}

/**
 * Wieviel ist geschafft. Drei Zahlen, nicht eine:
 *   gesammelt  hat einen Aufkleber (Fach 3+)   - was das Kind SIEHT
 *   gekonnt    Fach 5                          - was es WIRKLICH kann
 *   anteil     mittlere Fachhoehe              - was der Balken zeigt
 *
 * Der Balken haengt am Mittel, nicht an Fach 5. Sonst steht er tagelang auf
 * null, obwohl jede Sitzung etwas bewegt hat.
 */
function fortschritt(alle, stand) {
  const gesammelt = alle.filter(g => istGesammelt(stand, g.id)).length;
  const gekonnt = alle.filter(g => istGekonnt(stand, g.id)).length;
  const summe = alle.reduce((a, g) => a + ((stand[g.id]?.fach ?? 1) - 1), 0);
  return { gesammelt, gekonnt, gesamt: alle.length,
           anteil: alle.length ? summe / (alle.length * 4) : 0 };
}

return { FAECHER, neuerStand, verschieben, istFaellig, istGekonnt, HAT_AUFKLEBER, istGesammelt, sitzung, fortschritt };
})();

const Ablage = (function(){
/* Ablage. IndexedDB, ohne Zeremonie und ohne Abhaengigkeit.
 *
 * Alles bleibt auf dem Geraet. Nichts geht ins Netz - siehe Konzept K3,
 * Kapitel 13.3. Das ist keine Einstellung, sondern die Bauweise: es gibt
 * keinen Code, der etwas hochlaedt.
 */
const DB = 'lernkiste', FASSUNG = 1;
const LAEDEN = ['profile', 'fortschritt', 'protokoll', 'einstellungen'];

let db = null;
function oeffnen() {
  if (db) return db;
  db = new Promise((ja, nein) => {
    if (!('indexedDB' in globalThis)) return nein(new Error('kein IndexedDB'));
    const a = indexedDB.open(DB, FASSUNG);
    a.onupgradeneeded = () => {
      for (const l of LAEDEN)
        if (!a.result.objectStoreNames.contains(l)) a.result.createObjectStore(l);
    };
    a.onsuccess = () => ja(a.result);
    a.onerror = () => nein(a.error);
  });
  return db;
}

async function tun(laden, art, fn) {
  const d = await oeffnen();
  return new Promise((ja, nein) => {
    const t = d.transaction(laden, art);
    const s = t.objectStore(laden);
    const a = fn(s);
    t.oncomplete = () => ja(a && 'result' in a ? a.result : undefined);
    t.onerror = () => nein(t.error);
  });
}

const hole   = (laden, k) => tun(laden, 'readonly',  s => s.get(k));
const setze  = (laden, k, w) => tun(laden, 'readwrite', s => s.put(w, k));
const loesche= (laden, k) => tun(laden, 'readwrite', s => s.delete(k));
const alles  = (laden) => tun(laden, 'readonly', s => s.getAll());
const leeren = (laden) => tun(laden, 'readwrite', s => s.clear());

/** Anhaengen an eine Liste. Fuer das Protokoll: nur schreiben, nie aendern. */
async function anhaengen(laden, eintrag) {
  const d = await oeffnen();
  return new Promise((ja, nein) => {
    const t = d.transaction(laden, 'readwrite');
    t.objectStore(laden).put(eintrag, `${eintrag.zeit}-${Math.random().toString(36).slice(2,8)}`);
    t.oncomplete = ja; t.onerror = () => nein(t.error);
  });
}

/**
 * Befund L6: ohne diese Anforderung gilt der Speicher als "best effort" und
 * darf vom System geraeumt werden. Ein Aufruf, eine Zeile.
 *
 * Sie kann abgelehnt werden - deshalb wird das Ergebnis GEMERKT und im
 * Elternbereich angezeigt, statt es zu behaupten.
 */
async function dauerhaft() {
  try {
    if (!navigator.storage || !navigator.storage.persist) return { moeglich:false };
    const schon = await navigator.storage.persisted();
    const gewaehrt = schon || await navigator.storage.persist();
    let platz = null;
    if (navigator.storage.estimate) {
      const e = await navigator.storage.estimate();
      platz = { benutzt: e.usage, frei: e.quota };
    }
    return { moeglich:true, gewaehrt, platz };
  } catch (e) { return { moeglich:false, fehler:String(e) }; }
}

/** Alles zu einem Profil loeschen. Unwiderruflich, ein Tipp. */
async function profilLoeschen(profilId) {
  const d = await oeffnen();
  for (const laden of ['fortschritt', 'protokoll']) {
    const schluessel = await tun(laden, 'readonly', s => s.getAllKeys());
    const werte = await alles(laden);
    await tun(laden, 'readwrite', s => {
      werte.forEach((w, i) => { if (w && w.profil === profilId) s.delete(schluessel[i]); });
    });
  }
  await loesche('profile', profilId);
}

return { hole, setze, loesche, alles, leeren, anhaengen, dauerhaft, profilLoeschen };
})();

const Protokoll = (function(){
/* Der Ereignisstrom. Anhaengend, nie aendernd.
 *
 * `roheingabe` ist der wertvollste Teil: nach zwei Wochen steht dort
 * schwarz auf weiss, wie das Erkennungssystem Fionas Aussprache tatsaechlich
 * hoert - und daraus waechst die eingefrorene Korpushaelfte mit echten Daten
 * statt mit Vermutungen.
 */
const A = Ablage;

function eintrag(x) {
  return {
    zeit: x.zeit, profil: x.profil, modul: 'erdkunde', ebene: x.ebene, gebietId: x.gebietId,
    eingabeart: x.eingabeart, ergebnis: x.ergebnis,
    roheingabe: x.roheingabe ?? '', sicherheit: x.sicherheit ?? null,
    dauerMs: x.dauerMs, versuch: x.versuch,
    fachVorher: x.fachVorher ?? null, fachNachher: x.fachNachher ?? null,

}
const schreiben = (e) => A.anhaengen('protokoll', e).catch(() => {});
const lesen = (profil) => A.alles('protokoll')
  .then(a => a.filter(e => !profil || e.profil === profil).sort((x, y) => x.zeit - y.zeit))
  .catch(() => []);

/* ---------------------------------------------------------- Auswertung -- */

function auswerten(eintraege, namen) {
  const je = new Map();
  for (const e of eintraege) {
    const z = je.get(e.gebietId) || { id: e.gebietId, name: namen[e.gebietId] || e.gebietId,
                                      richtig: 0, fast: 0, falsch: 0, dauer: 0, n: 0 };
    z[e.ergebnis] = (z[e.ergebnis] || 0) + 1;
    z.dauer += e.dauerMs || 0; z.n++;
    je.set(e.gebietId, z);
  }
  const liste = [...je.values()].map(z => ({ ...z,
    quote: z.n ? z.richtig / z.n : 0, schnitt: z.n ? Math.round(z.dauer / z.n) : 0 }));
  return {
    gesamt: eintraege.length,
    richtig: eintraege.filter(e => e.ergebnis === 'richtig').length,
    jeGebiet: liste.sort((a, b) => a.quote - b.quote),
    /** Die fuenf mit den meisten Fehlversuchen. */
    wackelkandidaten: liste.filter(z => z.n >= 2).sort((a, b) =>
      (b.falsch + b.fast) - (a.falsch + a.fast)).slice(0, 5),
    /** Was gesagt wurde vs. was verstanden wurde. Der Rueckkanal fuer M4. */
    aussprache: eintraege.filter(e => e.eingabeart === 'sprechen' && e.roheingabe)
      .map(e => ({ zeit: e.zeit, gesagt: e.roheingabe, gemeint: namen[e.gebietId] || e.gebietId,
                   ergebnis: e.ergebnis, sicherheit: e.sicherheit })),
    /** Verlauf nach Tagen. */
    tage: [...eintraege.reduce((m, e) => {
      const t = new Date(e.zeit).toISOString().slice(0, 10);
      const z = m.get(t) || { tag: t, n: 0, richtig: 0 };
      z.n++; if (e.ergebnis === 'richtig') z.richtig++;
      return m.set(t, z);
    }, new Map()).values()],
  };
}

/* ------------------------------------------------------------- Ausfuhr -- */

                'sicherheit','dauerMs','versuch','fachVorher','fachNachher'];
  const zeile = (e) => [
    new Date(e.zeit).toISOString(), e.profil, e.ebene, namen[e.gebietId] || e.gebietId,
    e.eingabeart, e.ergebnis, e.roheingabe, e.sicherheit ?? '', e.dauerMs, e.versuch,
    e.fachVorher ?? '', e.fachNachher ?? '',
  ].map(w => { const s = String(w ?? ''); return /[";\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; })
   .join(';');
  return '﻿' + [kopf.join(';'), ...eintraege.map(zeile)].join('\r\n');
}

let stimme=null, tonAn=true, entsperrt=false;
function stimmeSuchen(){ const s=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('de'));
  stimme=s.find(v=>v.localService)||s[0]||null; }
if ('speechSynthesis' in window){ stimmeSuchen(); speechSynthesis.addEventListener('voiceschanged',stimmeSuchen); }
function vorlesen(text){
  if(!tonAn||!('speechSynthesis' in window)||!text) return;
  try{ if(!entsperrt){ speechSynthesis.speak(new SpeechSynthesisUtterance('')); entsperrt=true; }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='de-DE'; u.rate=.92;
    if(stimme)u.voice=stimme; speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- Aufgabenvorrat ---------------------------------------------- */
function vorrat(ebeneId){
  const [art, kont] = ebeneId.split(':');
  if (art==='kontinente')
    return D.kontinente.filter(k=>P.id==='fiona' ? k.runde<=3 : true)
      .map(k=>({ id:k.id, name:k.name, aliasse:k.aliasse, aussprache:k.aussprache,
                 pfad:k.pfad, anker:k.anker }));
  if (art==='laender')
    return D.laender[kont].filter(l=>l.rang<=P.laenderTiefe)
      .map(l=>({ id:l.a3, name:l.name, aliasse:l.aliasse, aussprache:l.aussprache,
                 pfad:l.pfad, anker:l.anker }));
  if (art==='bundeslaender')
    return D.deutschland.map(b=>({ id:b.id, name:b.name, aliasse:[], aussprache:[b.name.toLowerCase()],
      pfad:b.pfad, anker:b.anker }));
  if (art==='hauptstaedte')
    return D.deutschland.filter(b=>!b.stadtstaat).map(b=>({ id:b.id, name:b.hauptstadt,
      aliasse:[], aussprache:[b.hauptstadt.toLowerCase()], pfad:b.pfad, anker:b.anker,
      gebiet:b.name, ablenker:b.ablenker||[], falle:b.falle }));
  return [];
}

/* ---------- Bildschirmwechsel ------------------------------------------- */
function zeige(bau){
  Promise.resolve(bau()).then(neu=>{
    // ALLE bisherigen Bildschirme, nicht nur den sichtbaren. Wird zeige()
    // zweimal kurz hintereinander gerufen, bleibt sonst einer haengen -
    // im Elternbereich schimmerten drei Bildschirme uebereinander.
    const alte = [...buehne.querySelectorAll('.schirm')];
    neu.classList.add('schirm'); buehne.appendChild(neu);
    requestAnimationFrame(()=>{
      neu.classList.add('da');
      alte.forEach(a=>{ a.classList.remove('da'); setTimeout(()=>a.remove(),340); });
    });
  });
}

/* ---------- Sitzung starten ---------------------------------------------- */
/** Ein Keim, der sich reproduzieren laesst. Aus der Uhr geht das nicht. */
function keimAus(text){
  let h = 2166136261;
  for (let i=0;i<text.length;i++){ h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
async function starten(ebeneId){
  await standLaden(ebeneId);
  const alle = vorrat(ebeneId);
  // Die Sitzungsnummer waechst, die Uhr nicht: gleicher Fortschritt +
  // gleiche Nummer = gleiche Aufgabenfolge. Ohne das laesst sich die
  // Lernlogik nur behaupten, nicht nachrechnen (Konzept K3, Kapitel 7).
  const nrSchluessel = `nr:${P.id}:${ebeneId}`;
  let nr = 0;
  try { nr = (await Ablage.hole('einstellungen', nrSchluessel)) || 0; } catch(e){}
  nr++;
  try { await Ablage.setze('einstellungen', nrSchluessel, nr); } catch(e){}
  const keim = keimAus(`${P.id}|${ebeneId}|${nr}`);
  const liste = Leitner.sitzung(alle, Stand, P.sitzung, Date.now(), keim);
  Sitzung = { ebeneId, alle, liste, i:0, richtig:0, versuche:0, keim, begonnen:Date.now() };
  zeige(spielschirm);
}

/* ---------- Der Spielbildschirm ------------------------------------------ */
function spielschirm(){
  const s = el('div'), st = Sitzung, ziel = st.liste[st.i];
  const [art, kont] = st.ebeneId.split(':');
  const istHaupt = art==='hauptstaedte';
  const beginn = Date.now();
  let versuch = 0, erledigt = false;

  // Kandidaten: Ziel plus Ablenker. Bei Ebene 4 sind die Ablenker das
  // Eigentliche - fuenf Bundeslaender haben eine Hauptstadt, die NICHT ihre
  // groesste Stadt ist.
  // Mulberry32 statt eines einfachen linearen Kongruenzgenerators.
  //
  // Der LCG (x = x*1664525 + 1013904223) sieht fuer sich genommen zufaellig
  // aus, aber die Keime benachbarter Aufgaben liegen nur 7919 auseinander -
  // und bei einem LCG haengen die Ausgaben zu benachbarten Keimen linear
  // zusammen. Das Ergebnis: die richtige Stadt landete in zehn Aufgaben
  // hintereinander nur auf Platz 2 oder 3, nie auf 1 oder 4. Jede
  // Einzelpruefung war gruen - vier Staedte, eine richtig, eine aus dem
  // gleichen Land -, und die Aufgabe war trotzdem kaputt: wer raet, raet
  // in der Mitte.
  //
  // Mulberry32 verwuerfelt den Keim erst, bevor er zaehlt. Gefunden hat das
  // der Rauchtest, nicht das Auge.
  const rnd = (k)=>{ let x=k>>>0; return ()=>{
    x=(x+0x6D2B79F5)>>>0;
    let t=Math.imul(x^(x>>>15), 1|x);
    t=(t+Math.imul(t^(t>>>7), 61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296; }; };
  const misch=(a,r)=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
  const r1 = rnd(st.keim + st.i*7919);
  let kand;
  if (istHaupt) {
    // IMMER genau vier Staedte, genau eine richtig, Reihenfolge je Aufgabe
    // neu gewuerfelt.
    //
    // Die drei falschen sind nicht beliebig zusammengesucht:
    //
    // EINE kommt aus demselben Bundesland. Das ist die eigentliche Falle -
    // bei fuenf Laendern ist die groesste Stadt NICHT die Hauptstadt
    // (Frankfurt/Wiesbaden, Koeln/Duesseldorf, Leipzig/Dresden,
    // Halle/Magdeburg, Rostock/Schwerin). Dort steht der Irrtum, um den es
    // geht, also steht dort die erstgenannte Stadt fest. Bei den anderen
    // acht wechselt sie, damit die Aufgabe nicht auswendig zu lernen ist.
    //
    // ZWEI sind Hauptstaedte ANDERER Bundeslaender. Ohne sie stuenden vier
    // Namen aus derselben Ecke Deutschlands da, und das Kind koennte die
    // richtige an der Landsmannschaft erkennen statt am Wissen.
    const ausDemLand = ziel.ablenker || [];
    const gewaehlt = ausDemLand.length
      ? (ziel.falle ? ausDemLand[0] : ausDemLand[Math.floor(r1() * ausDemLand.length)])
      : null;
    const falle = gewaehlt
      ? [{ id:'x-'+gewaehlt, name:gewaehlt, aliasse:[], aussprache:[gewaehlt.toLowerCase()] }] : [];
    const fremd = misch(st.alle.filter(x=>x.id!==ziel.id), r1).slice(0, 3 - falle.length);
    kand = misch([ziel, ...falle, ...fremd], r1);
  } else {
    const n = Math.min(P.kandidaten, st.alle.length) - 1;
    kand = misch([ziel, ...misch(st.alle.filter(x=>x.id!==ziel.id), r1).slice(0, Math.max(1,n))], r1);
  }

  // Antarktika bekommt seine EIGENE, polare Ansicht. In der Weltkarte liegt
  // es als Sockel am unteren Rand und ist dort gerade nicht formtypisch.
  const polar = art==='kontinente' && ziel.id==='antarktika';
  // Antarktika kommt in der Weltkarte GAR NICHT vor. Es hat seine eigene
  // Ansicht; in der Weltkarte bleibt sonst ein grauer Sockel am unteren Rand
  // stehen, der wie ein Fehler aussieht.
  const formen = polar ? [D.antarktika]
    : art==='kontinente' ? st.alle.filter(g=>g.id!=='antarktika') : st.alle;
  const vb = polar ? D.vbA : art==='kontinente' ? D.vbK : art==='laender' ? D.vbL[kont] : D.vbD;
  const farbeVon=(g,i)=> (art==='bundeslaender'||istHaupt) ? `var(${VIER[(D.farben[g.id]??i)%4]})` : `var(${FL[i%7]})`;
  const umgebung = (art==='laender' && D.umgebung[kont])
    ? D.umgebung[kont].map(p=>`<path d="${p}" fill="var(--app-linie)" opacity=".55"/>`).join('') : '';
  const flaechen = formen.map((g,i)=>`<path class="geb ${g.id===ziel.id?'ziel':'ruhig'}" data-id="${g.id}"
      d="${g.pfad}" fill-rule="evenodd" fill="${farbeVon(g,i)}"/>`).join('');
  const konturen = formen.map(g=>`<path d="${g.pfad}" fill-rule="evenodd"/>`).join('');
  // Der Umriss des gesuchten Gebiets, zweimal: ein ruhiger dicker Rand und
  // darueber ein pulsierender. Ohne das ist bei sieben Pastellflaechen nicht
  // zu erkennen, welche gemeint ist.
  const zielForm = formen.find(g=>g.id===ziel.id) || ziel;
  // Der Zeiger wird in BILDSCHIRMPUNKTEN gezeichnet, nicht in
  // Kartenkoordinaten: sonst schrumpft er mit dem Massstab und ist auf
  // Thueringen nur noch ein blauer Fleck.
  const zeiger = zielForm.anker
    ? `<g class="zeiger" data-x="${zielForm.anker[0]}" data-y="${zielForm.anker[1]}">
         <path d="M0 -2 L-9 -17 L9 -17 Z" fill="var(--akzent)"/>
         <circle cy="-26" r="11" fill="var(--akzent)" stroke="white" stroke-width="2.5"/>
         <path d="M0 -32 L0 -21 M0 -18.5 L0 -18.4" stroke="white" stroke-width="2.6"
               stroke-linecap="round" fill="none"/>
       </g>` : '';
  // Ebene 4 fragt nach der Hauptstadt, nicht nach der Schreibweise. Eine Stadt
  // zu tippen, die man noch nie gesehen hat, prueft das Buchstabieren - nicht
  // das Wissen, um das es hier geht. Deshalb ist diese Ebene fuer BEIDE
  // Profile eine Auswahl. Im Elternbereich abschaltbar, dann tippt Lea auch
  // hier wieder.
  const tippt = P.eingabe.includes('tippen') && !(istHaupt && Einst.hauptstadtAuswahl);
  const spricht = P.eingabe.includes('sprechen');
  const frageText = istHaupt ? `Wie heißt die Hauptstadt von ${ziel.gebiet}?`
    : art==='kontinente' ? 'Wie heißt dieser Kontinent?'
    : art==='laender' ? 'Wie heißt dieses Land?' : 'Wie heißt dieses Bundesland?';
  const fach = Stand[ziel.id]?.fach ?? 1;

  s.innerHTML = `
    <div class="kopf">
      <button class="knopf" id="zur">${ZURUECK}<span>Zurück</span></button>
      <span class="fortschritt">${st.i+1} von ${st.liste.length}
        <span class="fach" title="Leitner-Fach">Fach ${fach}</span></span>
      ${sterne(Math.min(3, Math.floor(st.richtig/Math.max(1,Math.ceil(st.liste.length/3)))))}
    </div>
    <div class="frage" id="frage">${frageText}</div>
    <div class="feld">
      <div class="karte" id="karte">
        <svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet">
          <defs><clipPath id="wasch"><circle id="waschKreis" cx="0" cy="0" r="900"
            style="transform-box:fill-box;transform-origin:center"/></clipPath></defs>
          <g id="umg">${umgebung}</g>
          <g id="fl">${flaechen}</g>
          <g id="treffer"></g>
          <path id="belohn" d="" fill="oklch(.80 .12 155)" clip-path="url(#wasch)" style="display:none"/>
          <g fill="none" stroke="var(--tinte)" stroke-opacity=".5" stroke-width="1.1"
             vector-effect="non-scaling-stroke">${konturen}</g>
          <path class="zielrand" d="${zielForm.pfad}" fill="none" fill-rule="evenodd"
                stroke="var(--tinte)" stroke-width="3.5" stroke-linejoin="round"
                vector-effect="non-scaling-stroke"/>
          <path class="zielpuls" d="${zielForm.pfad}" fill="none" fill-rule="evenodd"
                stroke="var(--akzent)" stroke-width="3" stroke-linejoin="round"
                vector-effect="non-scaling-stroke"/>
          ${zeiger}
          <path id="kontur" d="" fill="none" stroke="var(--tinte)" stroke-width="2.4"
                vector-effect="non-scaling-stroke" stroke-linejoin="round" style="display:none"/>
          <circle id="stadtpunkt" r="0" fill="var(--akzent)" stroke="white" stroke-width="2"
                  vector-effect="non-scaling-stroke" style="display:none"/>
        </svg>
      </div>
      <div class="seite" id="seite"></div>
    </div>`;

  const seite = s.querySelector('#seite');
  const liste = el('div','wahlliste'), werkzeug = el('div','werkzeug');
  seite.append(liste, werkzeug);
  s.querySelector('#zur').onclick=()=>zeige(ebenenwahl);

  const MIN_PT = 44, MIN_REST = 20;
  function trefferflaechen(){
    const svg=s.querySelector('.karte svg'); if(!svg) return;
    const g=svg.querySelector('#treffer'); const ctm=svg.getScreenCTM(); if(!g||!ctm) return;
    const k=Math.abs(ctm.a)||1;
    const mit = formen.filter(x=>x.anker).map(x=>{
      const p=s.querySelector(`path.geb[data-id="${x.id}"]`); const bb=p?p.getBBox():{width:0,height:0};
      return { x, gross:Math.max(bb.width,bb.height) };
    }).sort((a,b)=>b.gross-a.gross);

    // Ein Trefferkreis darf den Anker eines ANDEREN Gebiets nicht
    // verschlucken. Berlins 44-Punkt-Kreis lag genau auf Brandenburgs Anker -
    // und Brandenburg war an seiner besten Stelle nicht mehr zu treffen.
    // "Das kleinere gewinnt" heisst nicht "das kleinere sperrt aus".
    // Der Zeiger hilft bei kleinen Gebieten und stoert bei grossen.
    const zg = s.querySelector('.zeiger');
    if (zg) {
      const zp = s.querySelector(`path.geb[data-id="${ziel.id}"]`);
      const zb = zp ? zp.getBBox() : {width:0,height:0};
      const gross = Math.max(zb.width, zb.height) * k;
      zg.style.display = gross < 190 ? '' : 'none';
      // Feste Groesse am Bildschirm: 1/k hebt den Kartenmassstab auf.
      const px = 1 / k;
      const x = +zg.dataset.x, y = +zg.dataset.y;
      const oben = (zb.height * k < 44) ? -zb.height/2 - 4*px : 0;   // ueber winzigen Flaechen
      zg.setAttribute('transform', `translate(${x} ${y + oben}) scale(${px.toFixed(3)})`);
    }
    g.innerHTML = mit.filter(n=>n.gross*k<MIN_PT).map(n=>{
      let rPx = MIN_PT/2;
      for (const m of mit) {
        if (m.x.id === n.x.id) continue;
        const d = Math.hypot(n.x.anker[0]-m.x.anker[0], n.x.anker[1]-m.x.anker[1]) * k;
        if (d > 0) rPx = Math.min(rPx, d * 0.55);
      }
      rPx = Math.max(rPx, MIN_REST/2);
      return `<circle data-id="${n.x.id}" cx="${n.x.anker[0]}" cy="${n.x.anker[1]}"
        r="${(rPx/k).toFixed(1)}" fill="transparent" style="pointer-events:all"/>`;
    }).join('');
  }

  if (tippt) {
    const eing=el('input','eingabe'); eing.type='text'; eing.autocapitalize='off';
    eing.autocorrect='off'; eing.spellcheck=false; eing.placeholder='hier schreiben';
    eing.setAttribute('inputmode','text');
    const hin=el('div');
    const ok=el('button','knopf'); ok.style.justifyContent='center'; ok.style.fontSize='var(--s0)';
    ok.textContent='Prüfen';
    liste.append(eing, ok, hin);
    const p=()=>bewerte(eing.value,'tippen',{eing,hin});
    ok.onclick=p; eing.addEventListener('keydown',e=>{ if(e.key==='Enter')p(); });
    setTimeout(()=>eing.focus(),360);
  } else {
    kand.forEach(k=>{ const b=el('div','etikett'); b.textContent=k.name; b.dataset.id=k.id;
      b.onclick=()=>vorlesen(k.name); ziehbar(b,k); liste.appendChild(b); });
  }

  if (spricht) {
    const mik=el('button','mikro',MIKRO);
    const status=el('div','unter'); status.style.fontSize='var(--s-klein)';
    const Erk = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Erk || !Einst.sprachmodus) {
      mik.classList.add('tonaus');
      status.textContent = !Erk
        ? 'Sprechen geht in diesem Browser nicht — Stufe C: sag es laut, dann zieh.'
        : 'Sprachmodus ist aus. Im Elternbereich einschalten.';
      mik.onclick=()=>vorlesen('Sag es laut!');
    } else {
      mik.onclick=()=>{
        const e=new Erk(); e.lang='de-DE'; e.interimResults=false; e.maxAlternatives=3;
        status.textContent='… ich höre';
        e.onresult=(ev)=>{ const roh=ev.results[0][0].transcript;
          status.textContent=`gehört: „${roh}“`; bewerte(roh,'sprechen',{status}); };
        e.onerror=()=>{ status.textContent='Das hat nicht geklappt — sag es noch einmal.'; };
        try{ e.start(); }catch(err){ status.textContent='Mikrofon nicht verfügbar.'; }
      };
    }
    werkzeug.appendChild(mik); liste.appendChild(status);
  }

  function ziehbar(b,k){
    let start=null;
    b.addEventListener('pointerdown',ev=>{
      if(b.classList.contains('weg')) return;
      b.setPointerCapture(ev.pointerId);
      const r=b.getBoundingClientRect(); start={x:ev.clientX,y:ev.clientY};
      b.classList.add('zieht'); b.style.position='fixed'; b.style.left=r.left+'px';
      b.style.top=r.top+'px'; b.style.width=r.width+'px'; b.style.margin='0';
      b.style.transform='scale(1.06) rotate(-1.5deg)'; vorlesen(k.name);
    });
    b.addEventListener('pointermove',ev=>{ if(!start) return;
      b.style.transform=`translate3d(${ev.clientX-start.x}px,${ev.clientY-start.y}px,0) scale(1.06) rotate(-1.5deg)`; });
    const los=(ev)=>{ if(!start) return;
      b.style.transform=''; b.classList.remove('zieht'); b.style.position='';
      b.style.left=''; b.style.top=''; b.style.width=''; b.style.margin='';
      const unten=document.elementFromPoint(ev.clientX,ev.clientY); start=null;
      const kreis=unten&&unten.closest&&unten.closest('#treffer circle');
      const pfad =unten&&unten.closest&&unten.closest('path.geb');
      const id = kreis?kreis.dataset.id : (pfad?pfad.dataset.id:null);
      if (id) bewerte(k.name,'ziehen',{ etikett:b, getroffen:id });
    };
    b.addEventListener('pointerup',los);
    b.addEventListener('pointercancel',()=>{ start=null; b.style.transform='';
      b.classList.remove('zieht'); b.style.position=''; });
  }

  /* --- Bewertung. EIN Ort, egal welcher Eingabeweg. --- */
  async function bewerte(roh, eingabeart, ctx){
    if (erledigt) return;
    versuch++; st.versuche++;
    let ergebnis='falsch', text='', sicherheit=null;

    if (eingabeart==='ziehen') {
      if (ctx.getroffen===ziel.id && roh===ziel.name) ergebnis='richtig';
      else if (roh===ziel.name) text='Fast! Das ist das falsche Gebiet.';
      else text='Das ist ein anderer Name.';
    } else if (eingabeart==='tippen') {
      const r = Vergleich.rechtschreibung(roh, ziel.name);
      if (r.urteil==='richtig') ergebnis='richtig';
      else if (r.urteil==='fast'){ ergebnis='fast'; text=r.hinweis; }
      else { const t=Vergleich.abgleich(roh,kand);
        text = t.art==='nochmal' ? 'Das kenne ich nicht.'
             : t.id===ziel.id ? 'Fast! Schau noch mal genau hin.' : `Das wäre ${t.name}.`; }
    } else {
      const t = Vergleich.abgleich(roh, kand);
      sicherheit = t.abstand!==undefined ? +(1-t.abstand).toFixed(2) : null;
      if (t.art==='nochmal') text='Sag es noch einmal.';
      else if (t.id!==ziel.id) text=`Das wäre ${t.name}.`;
      else if (t.art==='rueckfrage'){ text=`Meintest du ${t.name}?`; ergebnis='fast'; }
      else ergebnis='richtig';
    }

    const fachVorher = Stand[ziel.id]?.fach ?? 1;
    if (ergebnis!=='falsch') {
      erledigt = true;
      Stand = Leitner.verschieben(Stand, ziel.id, ergebnis==='richtig', Date.now());
      st.richtig += ergebnis==='richtig' ? 1 : 0.5;
      if (ctx.etikett) ctx.etikett.classList.add('weg');
      belohnung(s, ziel, ergebnis==='fast' ? text : null, istHaupt);
      vorlesen(ergebnis==='fast' ? text : ziel.name);
      standSichern(st.ebeneId);
    } else {
      if (ctx.hin){ ctx.hin.className='hinweis nochmal'; ctx.hin.textContent=text; }
      else if (ctx.status) ctx.status.textContent=text;
      else { let h=liste.querySelector('.hinweis');
        if(!h){ h=el('div','hinweis nochmal'); liste.appendChild(h); } h.textContent=text; }
      vorlesen(text);
    }

    Protokoll.schreiben(Protokoll.eintrag({
      zeit: Date.now(), profil: P.id, ebene: st.ebeneId, gebietId: ziel.id,
      eingabeart, ergebnis, roheingabe: eingabeart==='ziehen' ? '' : roh,
      sicherheit, dauerMs: Date.now()-beginn, versuch,
      fachVorher, fachNachher: Stand[ziel.id]?.fach ?? fachVorher,
    }));

    if (erledigt) setTimeout(()=>{ st.i++;
      if (st.i>=st.liste.length) zeige(endschirm); else zeige(spielschirm);
    }, ergebnis==='fast' ? 2400 : 1600);
  }

  requestAnimationFrame(()=>requestAnimationFrame(trefferflaechen));
  addEventListener('resize', trefferflaechen);
  return s;
}

/* ---------- Belohnungsmoment --------------------------------------------- */
function belohnung(s, ziel, fastText, zeigeStadt){
  // Beim Belohnen wird die Hervorhebung still - sonst blinkt es weiter,
  // waehrend sich der Umriss nachzeichnet.
  const kontur=s.querySelector('#kontur'), fuell=s.querySelector('#belohn'),
        kreis=s.querySelector('#waschKreis'), punkt=s.querySelector('#stadtpunkt');
  const flaeche=s.querySelector(`path.geb[data-id="${ziel.id}"]`);
  if(!kontur||!flaeche) return;
  flaeche.classList.add('treffer');
  s.querySelectorAll('.zielpuls,.zielrand,.zeiger').forEach(x=>x.style.display='none');
  s.querySelectorAll('path.geb.ruhig').forEach(x=>x.classList.remove('ruhig'));
  kontur.setAttribute('d',ziel.pfad); fuell.setAttribute('d',ziel.pfad);
  kontur.style.display=''; fuell.style.display='';
  const b=flaeche.getBBox();
  kreis.setAttribute('cx',b.x+b.width/2); kreis.setAttribute('cy',b.y+b.height/2);
  kreis.setAttribute('r',Math.max(b.width,b.height));
  const ruhig=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const L=kontur.getTotalLength(); kontur.style.strokeDasharray=L;
  if (ruhig){ kontur.style.strokeDashoffset=0; kreis.style.transform='scale(1)'; }
  else {
    kontur.style.strokeDashoffset=L;
    kontur.animate([{strokeDashoffset:L},{strokeDashoffset:0}],
      {duration:400,easing:'cubic-bezier(.2,0,0,1)',fill:'forwards'});
    kreis.style.transform='scale(0)';
    kreis.animate([{transform:'scale(0)'},{transform:'scale(1)'}],
      {duration:400,delay:360,easing:'cubic-bezier(.2,0,0,1)',fill:'forwards'});
  }
  // Ebene 4: der Stadtpunkt erscheint NACH der richtigen Antwort - als Zugabe.
  const stadt = zeigeStadt && D.deutschland.find(x=>x.id===ziel.id);
  if (stadt && stadt.ort && punkt) {
    punkt.setAttribute('cx',stadt.ort[0]); punkt.setAttribute('cy',stadt.ort[1]);
    punkt.style.display='';
    punkt.animate([{r:0},{r:7}],{duration:300,delay:600,easing:'cubic-bezier(.34,1.56,.64,1)',fill:'forwards'});
  }
  const frage=s.querySelector('#frage');
  if (frage) frage.innerHTML = fastText
    ? `<span style="color:var(--app-warn)">${fastText}</span>`
    : `<span style="color:var(--app-gut)">Richtig — ${ziel.name}!</span>`;
}

/* ---------- Forscherbuch: der Aufkleber IST der Umriss ------------------- */
async function forscherbuch(){
  const s = el('div');
  const gruppen = [];
  for (const e of EBENEN) {
    let st={}; try{ st=(await Ablage.hole('fortschritt',`${P.id}:${e.id}`))||{}; }catch(err){}
    const alle = vorrat(e.id);
    const vb = e.id.startsWith('kontinente') ? D.vbK
             : e.id.startsWith('laender') ? D.vbL[e.id.split(':')[1]] : D.vbD;
    gruppen.push({ titel:e.titel, vb, stuecke: alle.map((g,i)=>({
      ...g, gesammelt: Leitner.istGesammelt(st, g.id), gekonnt: Leitner.istGekonnt(st, g.id),
      fach: st[g.id]?.fach ?? 0, i })) });
  }
  const gesamt = gruppen.reduce((a,g)=>a+g.stuecke.filter(x=>x.gesammelt).length,0);
  s.innerHTML = `<div class="kopf">
      <button class="knopf" id="zur">${ZURUECK}<span>Zurück</span></button>
      <span class="fortschritt">${gesamt} Aufkleber</span><span></span></div>
    <div class="rollen">
      ${gruppen.map(g=>`
        <h3 class="gruppe">${g.titel}</h3>
        <div class="kleber">${g.stuecke.map(x=>`
          <button class="aufkleber ${x.gesammelt?'da':''} ${x.gekonnt?'sicher':''}"
                  data-lesen="${x.name}" title="Fach ${x.fach||'—'}">
            <svg viewBox="${g.vb}" aria-hidden="true"><path d="${x.pfad}" fill-rule="evenodd"
              fill="${x.gesammelt?`var(${FL[x.i%7]})`:'var(--app-linie)'}"
              stroke="var(--tinte)" stroke-opacity="${x.gesammelt?.6:.25}" stroke-width="1.6"
              vector-effect="non-scaling-stroke"/></svg>
            <span>${x.gesammelt?x.name:'?'}</span>
            ${x.gekonnt?'<i class="siegel"></i>':''}
          </button>`).join('')}</div>`).join('')}
    </div>`;
  s.querySelector('#zur').onclick=()=>zeige(ebenenwahl);
  s.querySelectorAll('[data-lesen]').forEach(b=>b.onclick=()=>vorlesen(b.dataset.lesen));
  return s;
}

/* Die PIN ist eine Tuerklinke, kein Schloss: sie liegt unverschluesselt in
   der Ablage und haelt neugierige Achtjaehrige ab, nicht Angreifer. */
function elternTor(){
  const s = el('div'); let eingabe='';
  s.innerHTML = `<div class="kopf">
      <button class="knopf" id="zur">${ZURUECK}<span>Zurück</span></button><span></span></div>
    <div class="mitte">
      <div class="titel">Elternbereich</div>
      <div class="unter">Vier Ziffern. Voreingestellt ist <code>0000</code>.</div>
      <div class="pin" id="pin">${'<i></i>'.repeat(4)}</div>
      <div class="ziffern">${[1,2,3,4,5,6,7,8,9,0].map(z=>`<button class="knopf zi" data-z="${z}">${z}</button>`).join('')}
        <button class="knopf zi" data-z="x" aria-label="löschen">${LOESCHEN}</button></div>
      <div class="unter" id="fehl" style="color:var(--app-warn)"></div>
    </div>`;
  // Punkte und Pfeil sind gezeichnet, nicht getippt. Als Schriftzeichen
  // (●, ○, ←) lagen sie ausserhalb des Schnitts `latin` und waeren aus der
  // Systemschrift gekommen - also in einer anderen Schrift als alles daneben.
  // Gefunden hat das Tor `schrift`.
  const anzeige=()=>s.querySelectorAll('#pin i')
    .forEach((p,i)=>p.classList.toggle('voll', i<eingabe.length));
  s.querySelector('#zur').onclick=()=>zeige(ebenenwahl);
  s.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{
    const z=b.dataset.z;
    if (z==='x') eingabe=eingabe.slice(0,-1);
    else if (eingabe.length<4) eingabe+=z;
    anzeige();
    if (eingabe.length===4) {
      if (eingabe===(Einst.pin||'0000')) zeige(elternbereich);
      else { s.querySelector('#fehl').textContent='Das war nicht richtig.'; eingabe=''; anzeige(); }
    }
  });
  return s;
}

        <strong>BKG VG250</strong>, Datenlizenz Deutschland Namensnennung 2.0
        (© GeoBasis-DE / BKG). Einwohnerzahlen: Stand ${BAU.standJahr}.</p>
    </div>`;

  s.querySelector('#zur').onclick=()=>zeige(ebenenwahl);
  s.querySelector('#sprach').onclick=async(e)=>{
    Einst.sprachmodus=!Einst.sprachmodus; await einstSichern();
    e.target.textContent=Einst.sprachmodus?'Sprachmodus ausschalten':'Sprachmodus einschalten'; };
  s.querySelector('#hsw').onclick=async(e)=>{
    Einst.hauptstadtAuswahl=!Einst.hauptstadtAuswahl; await einstSichern();
    e.target.textContent=Einst.hauptstadtAuswahl?'Auswahl abschalten, tippen lassen':'Auswahl einschalten'; };

  const sichern=(text,name,typ)=>{
    const ausgabe=s.querySelector('#ausgabe');
    try {
      const b=new Blob([text],{type:typ});
      const u=URL.createObjectURL(b); const a2=document.createElement('a');
      a2.href=u; a2.download=name; document.body.appendChild(a2); a2.click();
      setTimeout(()=>{ URL.revokeObjectURL(u); a2.remove(); },1000);
      ausgabe.innerHTML=`<p class="unter">Gesichert als <code>${name}</code>.</p>`;
    } catch(err) {
      // Faellt das Sichern aus (etwa in einer Vorschau ohne Download), wird
      // der Inhalt gezeigt statt verschwiegen.
      ausgabe.innerHTML=`<p class="unter">Sichern ging nicht — hier zum Kopieren:</p>
        <textarea class="ausgabefeld" readonly>${text.replace(/</g,'&lt;')}</textarea>`;
    }
  };
  s.querySelector('#csv').onclick=()=>sichern(Protokoll.alsCsv(eintraege,NAMEN),
    `lernkiste-${new Date().toISOString().slice(0,10)}.csv`,'text/csv;charset=utf-8');
  s.querySelector('#json').onclick=()=>sichern(Protokoll.alsJson(eintraege),
    `lernkiste-${new Date().toISOString().slice(0,10)}.json`,'application/json');
  s.querySelector('#weg').onclick=async(e)=>{
    if (e.target.dataset.sicher!=='ja'){ e.target.dataset.sicher='ja';
      e.target.textContent=`Wirklich? Alles von ${P.name} löschen`; return; }
    await Ablage.profilLoeschen(P.id);
    for (const eb of EBENEN) await Ablage.loesche('fortschritt',`${P.id}:${eb.id}`).catch(()=>{});
    s.querySelector('#ausgabe').innerHTML=`<p class="unter">Gelöscht.</p>`;
    setTimeout(()=>zeige(profilwahl),900);
  };
  return s;
}

/* ---------- Start --------------------------------------------------------- */
(async ()=>{ await einstLaden(); zeige(profilwahl); })();
</script>
</body></html>
