<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="mobile-web-app-capable" content="yes">

__KOPF__
<style>
/* === Marken. Identisch zu src/marken/marken.css. ====================== */
:root{
  --r1:4px;--r2:8px;--r3:12px;--r4:16px;--r6:24px;--r8:32px;--r12:48px;
  --rund-klein:8px;--rund-karte:16px;--rund-flaeche:24px;--rund-voll:999px;
  --s-klein:16px;--s0:20px;--s1:25px;--s2:31px;--s3:39px;--s4:49px;--s5:61px;
  --f-lesen:"Andika","Comic Sans MS",sans-serif;
  --f-ui:"Plus Jakarta Sans",system-ui,sans-serif;
  --f1:oklch(.88 .055 25);--f2:oklch(.88 .055 75);--f3:oklch(.88 .055 130);
  --f4:oklch(.88 .055 175);--f5:oklch(.88 .055 230);--f6:oklch(.88 .055 285);
  --f7:oklch(.88 .055 330);--auf-flaeche:oklch(.25 .03 250);
  --grund:oklch(.965 .008 85);--papier:oklch(1 0 0);--tinte:oklch(.27 .03 250);
  --tinte2:oklch(.5 .025 250);--tinte3:oklch(.68 .02 250);--linie:oklch(.88 .01 250);
  --akzent:oklch(.55 .15 250);--akzent-h:oklch(.94 .035 250);
  --gut:oklch(.62 .14 155);--gut-h:oklch(.93 .055 155);--warn:oklch(.65 .13 40);
  --tiefe:oklch(.80 .02 250);
  --d-tipp:120ms;--d-zustand:200ms;--d-schirm:320ms;--d-belohnung:500ms;
  --k-standard:cubic-bezier(.2,0,0,1);
}
:root[data-abend="an"]{
  --grund:oklch(.86 .01 85);--papier:oklch(.90 .006 85);
  --f1:oklch(.78 .05 25);--f2:oklch(.78 .05 75);--f3:oklch(.78 .05 130);
  --f4:oklch(.78 .05 175);--f5:oklch(.78 .05 230);--f6:oklch(.78 .05 285);--f7:oklch(.78 .05 330);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--grund);color:var(--tinte);font-family:var(--f-ui);line-height:1.3;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:manipulation;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#buehne{position:absolute;inset:0;display:flex;flex-direction:column}
.schirm{position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity var(--d-schirm) var(--k-standard)}
.schirm.da{opacity:1;pointer-events:auto}

.kopf{display:flex;align-items:center;justify-content:space-between;gap:var(--r3);
  padding:var(--r3) var(--r4);flex:none}
.knopf{font-family:var(--f-ui);font-size:var(--s0);font-weight:700;color:var(--tinte2);
  background:var(--papier);border:1px solid var(--linie);border-radius:var(--rund-voll);
  padding:var(--r2) var(--r4);min-height:44px;display:flex;align-items:center;gap:var(--r2);cursor:pointer}
.knopf:active{transform:scale(.97)}
.sterne{display:flex;gap:var(--r1)}
.fortschritt{font-family:var(--f-ui);font-size:var(--s0);font-weight:600;color:var(--tinte2);
  font-variant-numeric:tabular-nums}

.mitte{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--r4);padding:var(--r4);min-height:0}
.titel{font-family:var(--f-ui);font-size:var(--s3);font-weight:800;letter-spacing:-.02em;text-align:center}
.unter{font-family:var(--f-ui);font-size:var(--s0);color:var(--tinte2);text-align:center;max-width:34ch}

.wahl{display:flex;gap:var(--r4);flex-wrap:wrap;justify-content:center}
.kachel{background:var(--papier);border:none;border-radius:var(--rund-flaeche);
  box-shadow:0 3px 0 var(--tiefe);padding:var(--r6) var(--r8);min-width:150px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:var(--r2);
  transition:transform var(--d-tipp) var(--k-standard),box-shadow var(--d-tipp) var(--k-standard)}
.kachel:active{transform:translateY(2px);box-shadow:0 1px 0 var(--tiefe)}
.kachel .name{font-family:var(--f-lesen);font-size:var(--s2);font-weight:700;color:var(--auf-flaeche)}
.kachel .rolle{font-family:var(--f-ui);font-size:var(--s-klein);color:var(--tinte3)}
.kachel .kreis{width:64px;height:64px;border-radius:var(--rund-voll);display:flex;
  align-items:center;justify-content:center;font-family:var(--f-lesen);font-size:var(--s2);
  font-weight:700;color:var(--auf-flaeche)}

/* --- Spielfeld --- */
.feld{flex:1;display:flex;gap:var(--r4);padding:0 var(--r4) var(--r4);min-height:0}
@media (orientation:portrait){.feld{flex-direction:column}}
.karte{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;
  touch-action:none}
.karte svg{width:100%;height:100%;overflow:visible}
.karte path.geb{transition:fill var(--d-zustand) var(--k-standard)}
.karte path.ziel{fill:oklch(.80 .12 250)}
/* Alles ausser dem gesuchten Gebiet tritt zurueck. Bei sieben gleich hellen
   Pastellflaechen ist sonst nicht zu erkennen, welche gemeint ist. */
.karte path.geb.ruhig{opacity:.42;filter:saturate(.35)}
.karte path.treffer{fill:oklch(.86 .10 155);opacity:1;filter:none}
.karte .zielrand{opacity:.9}
.karte .zielpuls{animation:pulsrand 1.5s ease-in-out infinite}
@keyframes pulsrand{
  0%,100%{stroke-width:3;stroke-opacity:.95}
  50%    {stroke-width:9;stroke-opacity:.15}
}
.karte .zeiger{animation:huepfen 1.5s ease-in-out infinite;pointer-events:none}
@keyframes huepfen{0%,100%{translate:0 0}50%{translate:0 -6px}}
.seite{flex:none;display:flex;flex-direction:column;gap:var(--r2);min-height:0;
  /* "safe center" statt "center": laeuft der Inhalt ueber, rutscht er sonst
     ueber die OBERE Kante hinaus - im Querformat lag das erste Etikett dann
     unter der Kopfleiste, und der Finger traf die Leiste statt das Etikett. */
  justify-content:center;justify-content:safe center}
@media (orientation:landscape){.seite{width:min(38vw,300px)}}
@media (orientation:portrait){.seite{width:100%;max-height:44vh;overflow:auto}}

.frage{font-family:var(--f-ui);font-size:var(--s1);font-weight:700;text-align:center;
  padding:0 var(--r4) var(--r2)}
.etikett{position:relative;font-family:var(--f-lesen);font-size:var(--s1);font-weight:700;
  color:var(--auf-flaeche);background:var(--papier);border:none;border-radius:var(--rund-karte);
  padding:var(--r3) var(--r4);min-height:56px;display:flex;align-items:center;justify-content:center;
  text-align:center;box-shadow:0 2px 0 var(--tiefe);cursor:grab;touch-action:none;
  transition:transform var(--d-tipp) var(--k-standard),box-shadow var(--d-tipp) var(--k-standard),
             opacity var(--d-zustand) var(--k-standard)}
.etikett.zieht{box-shadow:0 6px 0 var(--tiefe);z-index:50;cursor:grabbing;transition:none}
.etikett.weg{visibility:hidden;pointer-events:none}
.wahlliste{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;
  gap:var(--r3);justify-content:center;justify-content:safe center;padding:2px}
.werkzeug{flex:none;display:flex;gap:var(--r3);align-items:center;justify-content:center;
  padding-top:var(--r2)}
.eingabe{font-family:var(--f-lesen);font-size:var(--s2);font-weight:700;background:var(--papier);
  border:2px solid var(--akzent);border-radius:var(--rund-karte);padding:var(--r3) var(--r4);
  min-height:64px;width:100%;color:var(--auf-flaeche);text-align:center}
.eingabe:focus{outline:none;border-color:var(--akzent);box-shadow:0 0 0 4px var(--akzent-h)}
.hinweis{font-family:var(--f-ui);font-size:var(--s0);line-height:1.4;border-radius:var(--rund-karte);
  padding:var(--r3) var(--r4);background:var(--gut-h);color:var(--auf-flaeche)}
.hinweis.nochmal{background:oklch(.95 .04 85)}
.reihe{display:flex;gap:var(--r2);align-items:center;justify-content:center;flex-wrap:wrap}
.mikro{width:76px;height:76px;border-radius:var(--rund-voll);background:var(--akzent);border:none;
  display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;position:relative}
.mikro::after{content:"";position:absolute;inset:-8px;border-radius:var(--rund-voll);
  border:3px solid var(--akzent);opacity:.3;animation:atmen 2.4s ease-in-out infinite}
@keyframes atmen{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.08);opacity:.1}}
.tonaus{background:var(--tinte3)}
.tonaus::after{display:none}

.gross{font-family:var(--f-ui);font-size:var(--s5);font-weight:800;letter-spacing:-.03em}
.bandhinweis{position:absolute;left:0;right:0;bottom:0;background:var(--tinte);color:var(--papier);
  font-family:var(--f-ui);font-size:var(--s-klein);padding:var(--r2) var(--r4);text-align:center}
/* Kurze Querformate: iPhone quer hat 390 Punkte Hoehe fuer alles. */
@media (max-height:440px){
  .etikett{font-size:var(--s0);min-height:48px;padding:var(--r2) var(--r3)}
  .kopf{padding:var(--r2) var(--r4)}
  .frage{font-size:var(--s0);padding:0 var(--r4) var(--r1)}
  .mikro{width:60px;height:60px}
}
/* --- M3 bis M6: Fortschritt, Forscherbuch, Elternbereich --- */
.balken{width:100%;height:8px;border-radius:var(--rund-voll);background:var(--linie);overflow:hidden}
.balken i{display:block;height:100%;background:var(--app-gut);border-radius:var(--rund-voll);
  transition:width var(--d-zustand) var(--k-standard)}
.balken.klein{height:6px;min-width:60px}
.fach{font-size:var(--s-klein);color:var(--tinte3);font-weight:600;margin-left:var(--r2)}

.rollen{flex:1;min-height:0;overflow:auto;padding:0 var(--r4) var(--r8);
  -webkit-overflow-scrolling:touch;touch-action:pan-y}
.rollen.eltern{max-width:760px;margin:0 auto;width:100%;text-align:left}
.rollen.eltern .unter{text-align:left;max-width:62ch}
.rollen.eltern .reihe{justify-content:flex-start}
.gruppe{font-family:var(--f-ui);font-size:var(--s1);font-weight:800;margin:var(--r6) 0 var(--r3);
  letter-spacing:-.01em}
.kleber{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:var(--r3)}
.aufkleber{background:var(--papier);border:none;border-radius:var(--rund-karte);padding:var(--r2);
  box-shadow:0 2px 0 var(--tiefe);display:flex;flex-direction:column;align-items:center;
  gap:var(--r1);cursor:pointer;opacity:.45}
.aufkleber.da{opacity:1}
.aufkleber{position:relative}
.aufkleber .siegel{position:absolute;top:6px;right:6px;width:12px;height:12px;border-radius:50%;
  background:var(--app-gut);border:2px solid var(--papier)}
.aufkleber svg{width:100%;height:64px}
.aufkleber span{font-family:var(--f-lesen);font-size:var(--s-klein);font-weight:700;
  color:var(--auf-flaeche);text-align:center;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

.pin{display:flex;gap:var(--r3);justify-content:center;align-items:center;min-height:34px}
.pin i{width:16px;height:16px;border-radius:var(--rund-voll);border:2.5px solid var(--akzent);
  transition:background var(--d-tipp) var(--k-standard)}
.pin i.voll{background:var(--akzent)}
.ziffern{display:grid;grid-template-columns:repeat(4,64px);gap:var(--r2);justify-content:center}
.zi{justify-content:center;font-size:var(--s1);min-height:56px}

.kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--r3)}
.wert{background:var(--papier);border-radius:var(--rund-karte);padding:var(--r3) var(--r4);
  box-shadow:0 2px 0 var(--tiefe)}
.wert b{display:block;font-size:var(--s2);font-weight:800;letter-spacing:-.02em}
.wert span{display:block;font-size:var(--s-klein);color:var(--tinte3)}

.tab{width:100%;border-collapse:collapse;background:var(--papier);border-radius:var(--rund-karte);
  overflow:hidden;font-size:var(--s-klein)}
.tab th,.tab td{text-align:left;padding:var(--r2) var(--r3);border-bottom:1px solid var(--linie)}
.tab th{font-weight:700;color:var(--tinte3);font-size:13px}
.tab tr:last-child td{border-bottom:0}
.tab .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ausgabefeld{width:100%;height:180px;font-family:var(--f-mono,monospace);font-size:12px;
  border:1px solid var(--linie);border-radius:var(--rund-klein);padding:var(--r2)}
code{font-family:ui-monospace,monospace;font-size:.9em;background:var(--linie);
  padding:.1em .35em;border-radius:4px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:1ms!important;transition-duration:1ms!important}
  /* Ohne Bewegung muss der Rand allein tragen - also dauerhaft dick. */
  .karte .zielpuls{stroke-width:7;stroke-opacity:.55}
}
</style></head>
<body><div id="buehne"></div>
<script id="daten" type="application/json">__DATEN__</script>
